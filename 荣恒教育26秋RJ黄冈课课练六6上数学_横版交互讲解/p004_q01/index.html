<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>操作题·在图上标出小岛位置</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0d2840 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(0,0,0,0.4);
}
.header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #4fc3f7, #81d4fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #4fc3f7, #81d4fa);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  color: #0a1628;
}
.main-container {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 60px);
}
.left-area {
  flex: 1;
  background: rgba(79,195,247,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(79,195,247,0.15);
 position: relative; overflow: hidden;}
.map-title {
  font-size: 18px;
  color: #4fc3f7;
  margin-bottom: 12px;
  text-align: center;
}
.map-container {
  position: relative;
  
  
  background: rgba(0,0,0,0.2);
  border-radius: 12px;
  border: 1px solid rgba(79,195,247,0.2);
 transform: scale(1.4); transform-origin: center;}
.map-svg {
  width: 100%;
  height: 100%;
}
.axis-line {
  stroke: #ff6b9d;
  stroke-width: 2;
}
.axis-arrow {
  fill: #ff6b9d;
}
.direction-label {
  font-size: 16px;
  font-weight: bold;
  fill: #ff6b9d;
  text-anchor: middle;
}
.lighthouse-marker {
  fill: #ffd700;
  stroke: #fff;
  stroke-width: 2;
}
.lighthouse-label {
  font-size: 14px;
  fill: #ffd700;
  font-weight: bold;
  text-anchor: middle;
}
.island-marker {
  fill: #4fc3f7;
  stroke: #fff;
  stroke-width: 2;
  opacity: 0;
  transition: opacity 0.5s;
}
.island-marker.show {
  opacity: 1;
}
.island-label {
  font-size: 14px;
  fill: #4fc3f7;
  font-weight: bold;
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.5s;
}
.island-label.show {
  opacity: 1;
}
.ray-line {
  stroke: #4fc3f7;
  stroke-width: 2;
  stroke-dasharray: 6,3;
  opacity: 0;
  transition: opacity 0.5s;
}
.ray-line.show {
  opacity: 1;
}
.angle-arc {
  fill: none;
  stroke: #ffd700;
  stroke-width: 2;
  stroke-dasharray: 4,3;
  opacity: 0;
  transition: opacity 0.5s;
}
.angle-arc.show {
  opacity: 1;
}
.angle-text {
  font-size: 13px;

  font-weight: bold;
  opacity: 0;
  transition: opacity 0.5s;
}
.angle-text.show {
  opacity: 1;
}
.scale-bar {
  position: absolute;
  bottom: 15px;
  right: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}

  width: 50px;

}
.scale-text {

}
.btn-mark {
  margin-top: 16px;

  border: none;
  background: linear-gradient(135deg, #4fc3f7, #0288d1);

  font-weight: bold;

}

  background: #555;

}
.right-panel {
  width: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px;
  border-left: 4px solid #4fc3f7;
}
.task-card h3 {
  font-size: 15px;
  color: #4fc3f7;
  margin-bottom: 10px;
}
.task-text {
  font-size: 13px;
  line-height: 1.8;
  color: #ddd;
  margin-bottom: 10px;
}
.task-text input {
  width: 50px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #555;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 13px;
  text-align: center;
  margin: 0 2px;
}
.task-text input.wide {
  width: 90px;
}
.task-text input:focus {
  outline: none;
  border-color: #4fc3f7;
}
.btn-verify {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #4fc3f7, #0288d1);
  color: #fff;
  font-weight: bold;

}
.feedback {
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
}
.feedback.correct { color: #4fc3f7; }
.feedback.wrong { color: #ff6b6b; }
.hint-box {
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
}
.hint-box p {
  font-size: 12px;
  color: #ffd700;
  line-height: 1.6;
}
.player-card {

}
.player-title {
  font-size: 14px;

}
.player-title.listen { color: #00bfff; }

.player-controls {
  display: flex;

}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00bfff, #0080ff);
  border-radius: 3px;

}
.time-display {
  font-size: 12px;
  color: #aaa;
  min-width: 80px;
  text-align: right;
}
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #0a1628, #1a3a5c);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  border: 2px solid #4fc3f7;
}
.overlay-content h2 { font-size: 28px; color: #4fc3f7; margin-bottom: 16px; }
.overlay-content p { font-size: 16px; color: #ddd; margin-bottom: 24px; }
.overlay-btn {
  padding: 12px 32px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff8c00, #ff6b00);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

  /* 旋转提示（可选，显示3秒后淡出） */
  }

/* 旋转提示层 */
50% { transform: rotate(90deg); }
}

/* ===== v2 竖屏自适应（JS控制旋转+整体缩放） ===== */

  background: #000 !important;

<body>
<div class="hint-text">已自动旋转为横屏模式<br>建议横屏观看效果更佳</div>
</div>


<div class="header">
  <h1>🏝️ 操作题·在图上标出小岛位置</h1>
  <div class="score-box">⭐ <span id="score">0</span> 分</div>
</div>

<div class="main-container">
  <div class="left-area">
    <div class="map-title">灯塔位置图（比例尺：1cm = 10km）</div>
    <div class="map-container">
      <svg class="map-svg" viewBox="0 0 380 380" id="mapSvg">
        <g id="axisLayer"></g>
        <g id="lighthouseLayer"></g>
        <g id="rayLayer"></g>
        <g id="islandLayer"></g>
      </svg>
      <div class="scale-bar">
        <div class="scale-line"></div>
        <div class="scale-text">10 km</div>
      </div>
    </div>
    <button class="btn-mark" id="markBtn" onclick="markIsland()">📍 标出小岛位置</button>
  </div>

  <div class="right-panel">
    <div class="task-card">
      <h3>📋 题目</h3>
      <div class="task-text">
        海上有一座灯塔，灯塔南偏西45°方向20km处有一座小岛，在图上标出小岛的位置。
      </div>
    </div>

    <div class="task-card">
      <h3>📋 填空</h3>
      <div class="task-text">
        先在灯塔(<input type="text" id="q1a" class="wide">)的方向上画一条射线，再在上面画出刻度表示(<input type="text" id="q1b" class="wide">)。<br>
        1cm表示10km，20km要用(<input type="text" id="q1c">)cm表示。
      </div>
      <button class="btn-verify" onclick="verifyQ1()">验证</button>
      <div class="feedback" id="fb1"></div>
      <div class="hint-box">
        <p>💡 提示：南偏西45°就是西南方向，20km是10km的2倍</p>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title listen">🎧 听题·动手做</div>
      <div class="player-controls">
        <button class="play-btn" id="listenBtn" onclick="toggleListen()">▶</button>
        <div class="progress-bar" onclick="seekListen(event)">
          <div class="progress-fill" id="listenProgress"></div>
        </div>
        <div class="time-display" id="listenTime">0:00 / 0:00</div>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title explain">📖 听讲·老师做</div>
      <div class="player-controls">
        <button class="play-btn" id="explainBtn" onclick="toggleExplain()">▶</button>
        <div class="progress-bar" onclick="seekExplain(event)">
          <div class="progress-fill" id="explainProgress"></div>
        </div>
        <div class="time-display" id="explainTime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-content">
    <h2>🎉 完成啦！</h2>
    <p>你已经完成了所有题目，来听听老师的讲解吧！</p>
    <button class="overlay-btn" onclick="playExplainFromOverlay()">📖 听讲·老师做</button>
  </div>
</div>

<audio id="listenAudio" src="audio/intro.mp3" preload="metadata"></audio>
<audio id="explainAudio" src="audio/explain.mp3" preload="metadata"></audio>

<script>
const CX = 190, CY = 190;
let score = 0;
let q1done = false;
let islandMarked = false;
let correctAnswersShown = false;

function initMap() {
  const axis = document.getElementById('axisLayer');
  
  const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  hLine.setAttribute('x1', 40);
  hLine.setAttribute('y1', CY);
  hLine.setAttribute('x2', 340);
  hLine.setAttribute('y2', CY);
  hLine.setAttribute('class', 'axis-line');
  axis.appendChild(hLine);
  
  const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  vLine.setAttribute('x1', CX);
  vLine.setAttribute('y1', 40);
  vLine.setAttribute('x2', CX);
  vLine.setAttribute('y2', 340);
  vLine.setAttribute('class', 'axis-line');
  axis.appendChild(vLine);
  
  const northArrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  northArrow.setAttribute('points', `${CX},35 ${CX-8},50 ${CX+8},50`);
  northArrow.setAttribute('class', 'axis-arrow');
  axis.appendChild(northArrow);
  
  const westArrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  westArrow.setAttribute('points', `35,${CY} 50,${CY-8} 50,${CY+8}`);
  westArrow.setAttribute('class', 'axis-arrow');
  axis.appendChild(westArrow);
  
  const dirs = [
    {name: '北', x: CX, y: 25},
    {name: '南', x: CX, y: 360},
    {name: '西', x: 25, y: CY + 5},
    {name: '东', x: 355, y: CY + 5}
  ];
  dirs.forEach(d => {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', d.x);
    text.setAttribute('y', d.y);
    text.setAttribute('class', 'direction-label');
    text.textContent = d.name;
    axis.appendChild(text);
  });
  
  const lighthouse = document.getElementById('lighthouseLayer');
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  marker.setAttribute('cx', CX);
  marker.setAttribute('cy', CY);
  marker.setAttribute('r', '10');
  marker.setAttribute('class', 'lighthouse-marker');
  lighthouse.appendChild(marker);
  
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', CX);
  label.setAttribute('y', CY + 28);
  label.setAttribute('class', 'lighthouse-label');
  label.textContent = '灯塔';
  lighthouse.appendChild(label);
}

function markIsland() {
  if (islandMarked) return;
  islandMarked = true;
  
  const rayLayer = document.getElementById('rayLayer');
  const islandLayer = document.getElementById('islandLayer');
  
  const angle = 180 + 45;
  const rad = angle * Math.PI / 180;
  const dist = 100;
  const ix = CX + dist * Math.cos(rad);
  const iy = CY + dist * Math.sin(rad);
  
  const ray = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ray.setAttribute('x1', CX);
  ray.setAttribute('y1', CY);
  ray.setAttribute('x2', ix);
  ray.setAttribute('y2', iy);
  ray.setAttribute('class', 'ray-line');
  rayLayer.appendChild(ray);
  setTimeout(() => ray.classList.add('show'), 100);
  
  const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const r = 40;
  const startRad = 90 * Math.PI / 180;
  const endRad = angle * Math.PI / 180;
  const sx = CX + r * Math.cos(startRad);
  const sy = CY + r * Math.sin(startRad);
  const ex = CX + r * Math.cos(endRad);
  const ey = CY + r * Math.sin(endRad);
  arc.setAttribute('d', `M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}`);
  arc.setAttribute('class', 'angle-arc');
  rayLayer.appendChild(arc);
  setTimeout(() => arc.classList.add('show'), 300);
  
  const angleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  const textRad = (90 + 22.5) * Math.PI / 180;
  angleText.setAttribute('x', CX + 55 * Math.cos(textRad));
  angleText.setAttribute('y', CY + 55 * Math.sin(textRad));
  angleText.setAttribute('class', 'angle-text');
  angleText.textContent = '45°';
  rayLayer.appendChild(angleText);
  setTimeout(() => angleText.classList.add('show'), 400);
  
  const island = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  island.setAttribute('cx', ix);
  island.setAttribute('cy', iy);
  island.setAttribute('r', '10');
  island.setAttribute('class', 'island-marker');
  islandLayer.appendChild(island);
  setTimeout(() => island.classList.add('show'), 600);
  
  const islandLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  islandLabel.setAttribute('x', ix);
  islandLabel.setAttribute('y', iy - 18);
  islandLabel.setAttribute('class', 'island-label');
  islandLabel.textContent = '小岛';
  islandLayer.appendChild(islandLabel);
  setTimeout(() => islandLabel.classList.add('show'), 700);
  
  document.getElementById('markBtn').textContent = '✅ 已标出小岛位置';
  document.getElementById('markBtn').disabled = true;
  addScore(10);
  checkComplete();
}

function verifyQ1() {
  if (q1done) return;
  const a = document.getElementById('q1a').value;
  const b = document.getElementById('q1b').value;
  const c = document.getElementById('q1c').value;
  const fb = document.getElementById('fb1');
  if (a.includes('南偏西45') && b.includes('20') && c === '2') {
    fb.textContent = '✅ 正确！南偏西45°方向画射线，20km用2cm表示';
    fb.className = 'feedback correct';
    q1done = true;
    addScore(10);
    if (!islandMarked) markIsland();
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，方向是南偏西45°，20km是几个10km？';
    fb.className = 'feedback wrong';
  }
}

function checkComplete() {
  if (q1done && islandMarked) {
    setTimeout(() => {
      document.getElementById('completeOverlay').classList.add('show');
    }, 500);
  }
}

function addScore(points) {
  score += points;
  document.getElementById('score').textContent = score;
}

// 双播放器逻辑
const listenAudio = document.getElementById('listenAudio');
const explainAudio = document.getElementById('explainAudio');
let listenPlaying = false;
let explainPlaying = false;

function initDualPlayers() {
  listenAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('listenTime').textContent = '0:00 / ' + formatTime(listenAudio.duration);
  });
  explainAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('explainTime').textContent = '0:00 / ' + formatTime(explainAudio.duration);
  });
  listenAudio.addEventListener('timeupdate', updateListenProgress);
  explainAudio.addEventListener('timeupdate', updateExplainProgress);
  listenAudio.addEventListener('ended', () => {
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  });
  explainAudio.addEventListener('ended', () => {
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  });
}

function toggleListen() {
  if (listenPlaying) {
    listenAudio.pause();
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  } else {
    if (explainPlaying) toggleExplain();
    listenAudio.play();
    listenPlaying = true;
    document.getElementById('listenBtn').textContent = '⏸';
    document.getElementById('listenBtn').classList.add('playing');
  }
}

function toggleExplain() {
  if (explainPlaying) {
    explainAudio.pause();
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  } else {
    if (listenPlaying) toggleListen();
    explainAudio.play();
    explainPlaying = true;
    document.getElementById('explainBtn').textContent = '⏸';
    document.getElementById('explainBtn').classList.add('playing');
    if (!correctAnswersShown) showCorrectAnswers();
  }
}

function playExplainFromOverlay() {
  document.getElementById('completeOverlay').classList.remove('show');
  listenAudio.pause();
  listenAudio.currentTime = 0;
  listenPlaying = false;
  document.getElementById('listenBtn').textContent = '▶';
  document.getElementById('listenBtn').classList.remove('playing');
  explainAudio.currentTime = 0;
  explainAudio.play();
  explainPlaying = true;
  document.getElementById('explainBtn').textContent = '⏸';
  document.getElementById('explainBtn').classList.add('playing');
  if (!correctAnswersShown) showCorrectAnswers();
}

function showCorrectAnswers() {
  correctAnswersShown = true;
  if (!islandMarked) markIsland();
  document.getElementById('q1a').value = '南偏西45°';
  document.getElementById('q1b').value = '20km';
  document.getElementById('q1c').value = '2';
}

function seekListen(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  listenAudio.currentTime = percent * listenAudio.duration;
}

function seekExplain(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  explainAudio.currentTime = percent * explainAudio.duration;
}

function updateListenProgress() {
  const percent = (listenAudio.currentTime / listenAudio.duration) * 100;
  document.getElementById('listenProgress').style.width = percent + '%';
  document.getElementById('listenTime').textContent = formatTime(listenAudio.currentTime) + ' / ' + formatTime(listenAudio.duration);
}

function updateExplainProgress() {
  const percent = (explainAudio.currentTime / explainAudio.duration) * 100;
  document.getElementById('explainProgress').style.width = percent + '%';
  document.getElementById('explainTime').textContent = formatTime(explainAudio.currentTime) + ' / ' + formatTime(explainAudio.duration);
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

initMap();
initDualPlayers();
</script>

<!-- ===== v2 竖屏自适应：旋转+缩放+右侧滚动+触摸坐标转换+drag模拟 ===== -->
<script>
(function(){
  var BASE_W = 1920, BASE_H = 1080;
  var scale = 1, isPortrait = false;
  var panelDone = false;

  function $(s, ctx){ return (ctx||document).querySelector(s); }
  function $$(s, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(s)); }

  /* ---- 1. 竖屏检测 + 旋转 + 整体缩放 ---- */
  function applyLayout(){
    var stage = document.getElementById('stage');
    if(!stage) return;
    var w = window.innerWidth, h = window.innerHeight;
    isPortrait = (h > w) && (w <= 900);

    if(isPortrait){
      var availW = h, availH = w;
      scale = Math.min(availW / BASE_H, availH / BASE_W);
      stage.style.width = BASE_W + 'px';
      stage.style.height = BASE_H + 'px';
      stage.style.marginLeft = -(BASE_W/2) + 'px';
      stage.style.marginTop = -(BASE_H/2) + 'px';
      stage.style.transform = 'rotate(90deg) scale(' + scale + ')';
      document.body.classList.add('portrait-mode');
      rearrangePanel();
    } else {
      stage.style.width = '';
      stage.style.height = '';
      stage.style.marginLeft = '';
      stage.style.marginTop = '';
      stage.style.transform = '';
      document.body.classList.remove('portrait-mode');
    }
  }

  /* ---- 2. 右侧边栏重排：播放器固定底部，其余可滚动 ---- */
  function rearrangePanel(){
    if(panelDone) return;
    var panels = $$('.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel');
    panels.forEach(function(panel){
      var players = $$('.explain-card, .player-card, .audio-card', panel);
      if(players.length === 0) return;
      var scrollArea = document.createElement('div');
      scrollArea.className = 'panel-scroll-area';
      var playersArea = document.createElement('div');
      playersArea.className = 'panel-players';
      players.forEach(function(p){ playersArea.appendChild(p); });
      while(panel.firstChild){ scrollArea.appendChild(panel.firstChild); }
      panel.appendChild(scrollArea);
      panel.appendChild(playersArea);
    });
    panelDone = true;
  }

  /* ---- 3. 触摸坐标转换（逆旋转+逆缩放） ---- */
  function convertCoords(cx, cy){
    if(!isPortrait) return {x:cx, y:cy};
    var scx = window.innerWidth/2, scy = window.innerHeight/2;
    var dx = (cx - scx) / scale;
    var dy = (cy - scy) / scale;
    // 逆旋转（逆时针90度）
    return { x: scx - dy, y: scy + dx };
  }

  function fireMouse(type, target, x, y){
    var evt = new MouseEvent(type, {bubbles:true, cancelable:true, clientX:x, clientY:y, button:0});
    target.dispatchEvent(evt);
  }

  function isInRightPanel(el){
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('students-panel')||el.classList.contains('right-panel')||
         el.classList.contains('info-panel')||el.classList.contains('answer-panel')||
         el.classList.contains('quiz-panel')||el.classList.contains('panel-scroll-area')||
         el.classList.contains('panel-players'))) return true;
      el = el.parentNode;
    }
    return false;
  }

  /* ---- 4. drag模拟状态 ---- */
  var dragSrc = null, lastDropTarget = null;

  function findDropTarget(x, y){
    var el = document.elementFromPoint(x, y);
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('seat')||el.classList.contains('drop-zone')||
         el.classList.contains('target')||el.classList.contains('cell')||
         el.getAttribute && el.getAttribute('data-drop') === '1')) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* ---- 5. 全局touch拦截（仅左侧交互区域） ---- */
  document.addEventListener('touchstart', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return; // 右侧边栏原生处理
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(!target) return;
    fireMouse('mousedown', target, coords.x, coords.y);
    // drag模拟
    if(target.getAttribute && target.getAttribute('draggable') === 'true'){
      dragSrc = target;
      var dt = new DataTransfer();
      try{
        var de = new DragEvent('dragstart', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt});
        target.dispatchEvent(de);
      }catch(err){}
    }
    if(target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') target.focus();
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y);
    if(target) fireMouse('mousemove', target, coords.x, coords.y);
    // drag模拟：dragover / dragleave
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget !== lastDropTarget){
        if(lastDropTarget){
          try{ lastDropTarget.dispatchEvent(new DragEvent('dragleave', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        if(dropTarget){
          try{ dropTarget.dispatchEvent(new DragEvent('dragover', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        lastDropTarget = dropTarget;
      }
    }
  }, {passive:false});

  document.addEventListener('touchend', function(e){
    if(!isPortrait) return;
    var t = e.changedTouches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(target){
      fireMouse('mouseup', target, coords.x, coords.y);
      fireMouse('click', target, coords.x, coords.y);
    }
    // drag模拟：drop / dragend
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget){
        try{
          var dt = new DataTransfer();
          dropTarget.dispatchEvent(new DragEvent('drop', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt}));
        }catch(err){}
      }
      try{ dragSrc.dispatchEvent(new DragEvent('dragend', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
      dragSrc = null;
      lastDropTarget = null;
    }
  }, {passive:false});

  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', function(){ setTimeout(applyLayout, 150); });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyLayout);
  } else {
    applyLayout();
  }
})();
</script>

</body>
