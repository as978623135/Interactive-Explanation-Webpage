<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2路公共汽车行驶路线·方向与距离</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a3e 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(0,0,0,0.4);
}
.header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ce93d8, #ba68c8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #ce93d8, #ba68c8);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  color: #1a0a2e;
}
.main-container {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 60px);
}
.left-area {
  flex: 1;
  background: rgba(206,147,216,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(206,147,216,0.15);
 position: relative; overflow: hidden;}
.map-title {
  font-size: 18px;
  color: #ce93d8;
  margin-bottom: 12px;
  text-align: center;
}
.map-container {
  position: relative;
  
  
  background: rgba(0,0,0,0.2);
  border-radius: 12px;
  border: 1px solid rgba(206,147,216,0.2);
 transform: scale(1.4); transform-origin: center;}
.map-svg {
  width: 100%;
  height: 100%;
}
.station-marker {
  fill: #ffd700;
  stroke: #fff;
  stroke-width: 2;
}
.station-label {
  font-size: 12px;
  fill: #ffd700;
  font-weight: bold;
  text-anchor: middle;
}
.route-line {
  stroke: #ff6b9d;
  stroke-width: 3;
  fill: none;
  stroke-dasharray: 1500;
  stroke-dashoffset: 1500;
  transition: stroke-dashoffset 3s ease-in-out;
}
.route-line.show {
  stroke-dashoffset: 0;
}
.bus {
  fill: #ce93d8;
  stroke: #fff;
  stroke-width: 2;
  opacity: 0;
  transition: opacity 0.3s;
}
.bus.show {
  opacity: 1;
}
.north-label {
  font-size: 14px;
  fill: #ff6b9d;
  font-weight: bold;
}
.btn-play {
  margin-top: 16px;
  padding: 12px 28px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #ce93d8, #9c27b0);
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}
.btn-play:hover { transform: scale(1.05); }
.btn-play:disabled {
  background: #555;
  cursor: not-allowed;
  transform: none;
}
.right-panel {
  width: 400px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.task-card {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px;
  border-left: 4px solid #ce93d8;
}
.task-card h3 {
  font-size: 15px;
  color: #ce93d8;
  margin-bottom: 10px;
}
.task-text {
  font-size: 13px;
  line-height: 2;
  color: #ddd;
  margin-bottom: 10px;
}
.task-text input {
  width: 50px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #555;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 13px;
  text-align: center;
  margin: 0 2px;
}
.task-text input.wide {
  width: 70px;
}
.task-text input:focus {
  outline: none;
  border-color: #ce93d8;
}
.btn-verify {
  padding: 8px 20px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #ce93d8, #9c27b0);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
  margin-top: 10px;
}
.feedback {
  font-size: 13px;
  margin-top: 8px;
  min-height: 18px;
}
.feedback.correct { color: #ce93d8; }
.feedback.wrong { color: #ff6b6b; }
.hint-box {
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
}
.hint-box p {
  font-size: 12px;
  color: #ffd700;
  line-height: 1.6;
}
.player-card {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px;
}
.player-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.player-title.listen { color: #00bfff; }
.player-title.explain { color: #ff8c00; }
.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00bfff, #0080ff);
  border-radius: 3px;
  width: 0%;
}
.time-display {
  font-size: 12px;
  color: #aaa;
  min-width: 80px;
  text-align: right;
}
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #1a0a2e, #2d1b4e);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  border: 2px solid #ce93d8;
}
.overlay-content h2 { font-size: 28px; color: #ce93d8; margin-bottom: 16px; }
.overlay-content p { font-size: 16px; color: #ddd; margin-bottom: 24px; }
.overlay-btn {
  padding: 12px 32px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff8c00, #ff6b00);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* ===== 竖屏自适应旋转（手机/平板自动横屏显示） ===== */
@media (orientation: portrait) and (max-width: 900px) {
  body {
    overflow: hidden;
    background: #000;
  }
  .stage {
    transform: rotate(90deg);
    transform-origin: center center;
    width: 100vh !important;
    height: 100vw !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    margin-left: -50vh !important;
    margin-top: -50vw !important;
    border-radius: 0 !important;
  }
  /* 旋转提示（可选，显示3秒后淡出） */
  .rotate-hint {
    display: flex !important;
  }
}

/* 旋转提示层 */
.rotate-hint {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 16px;
  animation: fadeOutHint 3s ease-in-out 2s forwards;
}
.rotate-hint .phone-icon {
  font-size: 64px;
  animation: rotatePhone 1.5s ease-in-out infinite;
}
.rotate-hint .hint-text {
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
}
@keyframes rotatePhone {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
@keyframes fadeOutHint {
  to { opacity: 0; visibility: hidden; }
}

</style>
</head>
<body>
<!-- 竖屏旋转提示 -->
<div class="rotate-hint">
  <div class="phone-icon">📱</div>
  <div class="hint-text">已自动旋转为横屏模式<br>建议横屏观看效果更佳</div>
</div>


<div class="header">
  <h1>🚌 2路公共汽车行驶路线·方向与距离</h1>
  <div class="score-box">⭐ <span id="score">0</span> 分</div>
</div>

<div class="main-container">
  <div class="left-area">
    <div class="map-title">2路公共汽车行驶路线图</div>
    <div class="map-container">
      <svg class="map-svg" viewBox="0 0 440 420" id="mapSvg">
        <g id="baseLayer"></g>
        <g id="routeLayer"></g>
        <g id="stationsLayer"></g>
        <g id="busLayer"></g>
      </svg>
    </div>
    <button class="btn-play" id="playBtn" onclick="playRoute()">▶ 播放电力公司→汽车东站路线</button>
  </div>

  <div class="right-panel">
    <div class="task-card">
      <h3>📋 第(1)问</h3>
      <div class="task-text">
        2路公共汽车从市政府向(<input type="text" id="a1">)偏(<input type="text" id="a2">)(<input type="text" id="a3" class="wide">)°方向行驶(<input type="text" id="a4">)站到书店。
      </div>
      <button class="btn-verify" onclick="verifyQ1()">验证</button>
      <div class="feedback" id="fb1"></div>
    </div>

    <div class="task-card">
      <h3>📋 第(2)问·描述路线</h3>
      <div class="task-text">
        从电力公司出发，先向(<input type="text" id="b1">)方向行驶(<input type="text" id="b2">)站到达书店，接着向(<input type="text" id="b3">)偏(<input type="text" id="b4">)(<input type="text" id="b5" class="wide">)°方向行驶(<input type="text" id="b6">)站到达市政府，最后向(<input type="text" id="b7">)方向行驶(<input type="text" id="b8">)站到达汽车东站。
      </div>
      <button class="btn-verify" onclick="verifyQ2()">验证答案</button>
      <div class="feedback" id="fb2"></div>
      <div class="hint-box">
        <p>💡 提示：先数每段有几站，再判断方向（正南/北偏东/正东等）</p>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title listen">🎧 听题·动手做</div>
      <div class="player-controls">
        <button class="play-btn" id="listenBtn" onclick="toggleListen()">▶</button>
        <div class="progress-bar" onclick="seekListen(event)">
          <div class="progress-fill" id="listenProgress"></div>
        </div>
        <div class="time-display" id="listenTime">0:00 / 0:00</div>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title explain">📖 听讲·老师做</div>
      <div class="player-controls">
        <button class="play-btn" id="explainBtn" onclick="toggleExplain()">▶</button>
        <div class="progress-bar" onclick="seekExplain(event)">
          <div class="progress-fill" id="explainProgress"></div>
        </div>
        <div class="time-display" id="explainTime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-content">
    <h2>🎉 完成啦！</h2>
    <p>你已经完成了所有题目，来听听老师的讲解吧！</p>
    <button class="overlay-btn" onclick="playExplainFromOverlay()">📖 听讲·老师做</button>
  </div>
</div>

<audio id="listenAudio" src="audio/intro.mp3" preload="metadata"></audio>
<audio id="explainAudio" src="audio/explain.mp3" preload="metadata"></audio>

<script>
const stations = {
  '汽车东站': {x: 340, y: 40},
  '公园': {x: 340, y: 80},
  '超市': {x: 340, y: 120},
  '大关路': {x: 280, y: 120},
  '市政府': {x: 220, y: 120},
  '实验小学': {x: 180, y: 160},
  '医院': {x: 160, y: 180},
  '书店': {x: 140, y: 200},
  '电力公司': {x: 140, y: 240},
  '少年宫': {x: 140, y: 280},
  '明达中学': {x: 140, y: 320},
  '彩虹路': {x: 140, y: 360},
  '进修学校': {x: 90, y: 360},
  '汽车西站': {x: 50, y: 360}
};

let score = 0;
let q1done = false;
let q2done = false;
let routePlaying = false;
let correctAnswersShown = false;

function initMap() {
  const base = document.getElementById('baseLayer');
  
  const northText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  northText.setAttribute('x', 400);
  northText.setAttribute('y', 60);
  northText.setAttribute('class', 'north-label');
  northText.textContent = '北 ↑';
  base.appendChild(northText);
  
  const stationsLayer = document.getElementById('stationsLayer');
  
  for (let name in stations) {
    const s = stations[name];
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    marker.setAttribute('cx', s.x);
    marker.setAttribute('cy', s.y);
    marker.setAttribute('r', '6');
    marker.setAttribute('class', 'station-marker');
    stationsLayer.appendChild(marker);
    
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', s.x);
    label.setAttribute('y', s.y - 10);
    label.setAttribute('class', 'station-label');
    label.textContent = name;
    stationsLayer.appendChild(label);
  }
  
  const route = document.getElementById('routeLayer');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const d = `M ${stations['电力公司'].x} ${stations['电力公司'].y} 
             L ${stations['书店'].x} ${stations['书店'].y} 
             L ${stations['医院'].x} ${stations['医院'].y} 
             L ${stations['实验小学'].x} ${stations['实验小学'].y} 
             L ${stations['市政府'].x} ${stations['市政府'].y} 
             L ${stations['大关路'].x} ${stations['大关路'].y} 
             L ${stations['超市'].x} ${stations['超市'].y} 
             L ${stations['公园'].x} ${stations['公园'].y} 
             L ${stations['汽车东站'].x} ${stations['汽车东站'].y}`;
  path.setAttribute('d', d);
  path.setAttribute('class', 'route-line');
  path.setAttribute('id', 'routePath');
  route.appendChild(path);
  
  const bus = document.getElementById('busLayer');
  const busCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  busCircle.setAttribute('cx', stations['电力公司'].x);
  busCircle.setAttribute('cy', stations['电力公司'].y);
  busCircle.setAttribute('r', '10');
  busCircle.setAttribute('class', 'bus');
  busCircle.setAttribute('id', 'bus');
  bus.appendChild(busCircle);
}

function playRoute() {
  if (routePlaying) return;
  routePlaying = true;
  
  document.getElementById('playBtn').textContent = '🚌 路线播放中...';
  document.getElementById('playBtn').disabled = true;
  
  const routePath = document.getElementById('routePath');
  const bus = document.getElementById('bus');
  
  routePath.classList.add('show');
  bus.classList.add('show');
  
  const pathLength = routePath.getTotalLength();
  let progress = 0;
  const duration = 5000;
  const startTime = Date.now();
  
  function animate() {
    const elapsed = Date.now() - startTime;
    progress = Math.min(elapsed / duration, 1);
    
    const point = routePath.getPointAtLength(progress * pathLength);
    bus.setAttribute('cx', point.x);
    bus.setAttribute('cy', point.y);
    
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      setTimeout(() => {
        document.getElementById('playBtn').textContent = '✅ 路线播放完成';
        addScore(5);
      }, 300);
    }
  }
  
  animate();
}

function verifyQ1() {
  if (q1done) return;
  const a1 = document.getElementById('a1').value;
  const a2 = document.getElementById('a2').value;
  const a3 = document.getElementById('a3').value;
  const a4 = document.getElementById('a4').value;
  const fb = document.getElementById('fb1');
  if ((a1 === '南' && a2 === '西' || a1 === '西' && a2 === '南') && a3 === '45' && a4 === '3') {
    fb.textContent = '✅ 正确！从市政府向南偏西45°方向行驶3站到书店';
    fb.className = 'feedback correct';
    q1done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，从市政府到书店经过几站？方向是什么？';
    fb.className = 'feedback wrong';
  }
}

function verifyQ2() {
  if (q2done) return;
  const b1 = document.getElementById('b1').value;
  const b2 = document.getElementById('b2').value;
  const b3 = document.getElementById('b3').value;
  const b4 = document.getElementById('b4').value;
  const b5 = document.getElementById('b5').value;
  const b6 = document.getElementById('b6').value;
  const b7 = document.getElementById('b7').value;
  const b8 = document.getElementById('b8').value;
  const fb = document.getElementById('fb2');
  
  const correct = (b1 === '正北' || b1 === '北') && b2 === '1' &&
                  (b3 === '北' && b4 === '东' || b3 === '东' && b4 === '北') && b5 === '45' && b6 === '3' &&
                  (b7 === '正东' || b7 === '东') && b8 === '4';
  
  if (correct) {
    fb.textContent = '✅ 完全正确！路线描述准确无误！';
    fb.className = 'feedback correct';
    q2done = true;
    addScore(15);
    if (!routePlaying) playRoute();
    checkComplete();
  } else {
    fb.textContent = '❌ 有错误，再检查一下方向和站数。提示：电力公司到书店1站，书店到市政府3站，市政府到汽车东站4站';
    fb.className = 'feedback wrong';
  }
}

function checkComplete() {
  if (q1done && q2done) {
    setTimeout(() => {
      document.getElementById('completeOverlay').classList.add('show');
    }, 1000);
  }
}

function addScore(points) {
  score += points;
  document.getElementById('score').textContent = score;
}

// 双播放器逻辑
const listenAudio = document.getElementById('listenAudio');
const explainAudio = document.getElementById('explainAudio');
let listenPlaying = false;
let explainPlaying = false;

function initDualPlayers() {
  listenAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('listenTime').textContent = '0:00 / ' + formatTime(listenAudio.duration);
  });
  explainAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('explainTime').textContent = '0:00 / ' + formatTime(explainAudio.duration);
  });
  listenAudio.addEventListener('timeupdate', updateListenProgress);
  explainAudio.addEventListener('timeupdate', updateExplainProgress);
  listenAudio.addEventListener('ended', () => {
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  });
  explainAudio.addEventListener('ended', () => {
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  });
}

function toggleListen() {
  if (listenPlaying) {
    listenAudio.pause();
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  } else {
    if (explainPlaying) toggleExplain();
    listenAudio.play();
    listenPlaying = true;
    document.getElementById('listenBtn').textContent = '⏸';
    document.getElementById('listenBtn').classList.add('playing');
  }
}

function toggleExplain() {
  if (explainPlaying) {
    explainAudio.pause();
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  } else {
    if (listenPlaying) toggleListen();
    explainAudio.play();
    explainPlaying = true;
    document.getElementById('explainBtn').textContent = '⏸';
    document.getElementById('explainBtn').classList.add('playing');
    if (!correctAnswersShown) showCorrectAnswers();
  }
}

function playExplainFromOverlay() {
  document.getElementById('completeOverlay').classList.remove('show');
  listenAudio.pause();
  listenAudio.currentTime = 0;
  listenPlaying = false;
  document.getElementById('listenBtn').textContent = '▶';
  document.getElementById('listenBtn').classList.remove('playing');
  explainAudio.currentTime = 0;
  explainAudio.play();
  explainPlaying = true;
  document.getElementById('explainBtn').textContent = '⏸';
  document.getElementById('explainBtn').classList.add('playing');
  if (!correctAnswersShown) showCorrectAnswers();
}

function showCorrectAnswers() {
  correctAnswersShown = true;
  if (!routePlaying) playRoute();
  document.getElementById('a1').value = '南';
  document.getElementById('a2').value = '西';
  document.getElementById('a3').value = '45';
  document.getElementById('a4').value = '3';
  document.getElementById('b1').value = '正北';
  document.getElementById('b2').value = '1';
  document.getElementById('b3').value = '北';
  document.getElementById('b4').value = '东';
  document.getElementById('b5').value = '45';
  document.getElementById('b6').value = '3';
  document.getElementById('b7').value = '正东';
  document.getElementById('b8').value = '4';
}

function seekListen(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  listenAudio.currentTime = percent * listenAudio.duration;
}

function seekExplain(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  explainAudio.currentTime = percent * explainAudio.duration;
}

function updateListenProgress() {
  const percent = (listenAudio.currentTime / listenAudio.duration) * 100;
  document.getElementById('listenProgress').style.width = percent + '%';
  document.getElementById('listenTime').textContent = formatTime(listenAudio.currentTime) + ' / ' + formatTime(listenAudio.duration);
}

function updateExplainProgress() {
  const percent = (explainAudio.currentTime / explainAudio.duration) * 100;
  document.getElementById('explainProgress').style.width = percent + '%';
  document.getElementById('explainTime').textContent = formatTime(explainAudio.currentTime) + ' / ' + formatTime(explainAudio.duration);
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

initMap();
initDualPlayers();
</script>
