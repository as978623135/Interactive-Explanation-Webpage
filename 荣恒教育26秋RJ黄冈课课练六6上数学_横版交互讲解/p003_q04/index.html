<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相对位置·方向相反距离一样</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(0,0,0,0.3);
}
.header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  color: #1a1a2e;
}
.main-container {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 60px);
}
.left-area {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
 position: relative; overflow: hidden;}
.compass-title {
  font-size: 18px;
  color: #ffd700;
  margin-bottom: 12px;
  text-align: center;
}
.compass-container {
  position: relative;
  
  
 transform: scale(1.4); transform-origin: center;}
.compass-svg {
  width: 100%;
  height: 100%;
}
.direction-label {
  font-size: 14px;
  font-weight: bold;
  fill: #ffd700;
  text-anchor: middle;
}
.location-marker {
  fill: #ff6b9d;
  stroke: #fff;
  stroke-width: 2;
}
.location-marker.reference {
  fill: #ffd700;
  r: 12;
}
.location-label {
  font-size: 14px;
  fill: #fff;
  font-weight: bold;
  text-anchor: middle;
}
.angle-arc {
  fill: none;
  stroke: #00bfff;
  stroke-width: 2;
  stroke-dasharray: 4,4;
}
.angle-text {
  font-size: 12px;
  fill: #00bfff;
  font-weight: bold;
}
.distance-line {
  stroke: #ffd700;
  stroke-width: 2;
  stroke-dasharray: 6,3;
}
.distance-text {
  font-size: 13px;
  fill: #ffd700;
  font-weight: bold;
}
.btn-switch {
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #ff6b9d, #ee5a6f);
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}
.btn-switch:hover { transform: scale(1.05); }
.right-panel {
  width: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.task-card {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
  border-left: 4px solid #ffd700;
}
.task-card h3 {
  font-size: 15px;
  color: #ffd700;
  margin-bottom: 10px;
}
.task-text {
  font-size: 13px;
  line-height: 1.8;
  color: #ddd;
  margin-bottom: 10px;
}
.task-text input {
  width: 45px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #555;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 13px;
  text-align: center;
  margin: 0 2px;
}
.task-text input:focus {
  outline: none;
  border-color: #ffd700;
}
.btn-verify {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #00ff88, #00c853);
  color: #1a1a2e;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  margin-top: 8px;
}
.feedback {
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
}
.feedback.correct { color: #00ff88; }
.feedback.wrong { color: #ff6b6b; }
.conclusion-box {
  background: rgba(0,191,255,0.1);
  border: 1px solid #00bfff;
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
}
.conclusion-box h4 {
  font-size: 14px;
  color: #00bfff;
  margin-bottom: 8px;
}
.conclusion-box p {
  font-size: 13px;
  color: #ddd;
  line-height: 1.6;
}
.player-card {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
}
.player-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.player-title.listen { color: #00bfff; }
.player-title.explain { color: #ff8c00; }
.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00bfff, #0080ff);
  border-radius: 3px;
  width: 0%;
}
.time-display {
  font-size: 12px;
  color: #aaa;
  min-width: 80px;
  text-align: right;
}
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  border: 2px solid #ffd700;
}
.overlay-content h2 { font-size: 28px; color: #ffd700; margin-bottom: 16px; }
.overlay-content p { font-size: 16px; color: #ddd; margin-bottom: 24px; }
.overlay-btn {
  padding: 12px 32px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff8c00, #ff6b00);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

@media (orientation: portrait) and (max-width: 900px) {
  body {
    overflow: hidden;
    background: #000;
  }
  .stage {
    transform: rotate(90deg);
    transform-origin: center center;
    width: 100vh !important;
    height: 100vw !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    margin-left: -50vh !important;
    margin-top: -50vw !important;
    border-radius: 0 !important;
  }
  /* 旋转提示（可选，显示3秒后淡出） */
  }

/* 旋转提示层 */
50% { transform: rotate(90deg); }
}
}


/* ===== v2 竖屏自适应（JS控制旋转+整体缩放） ===== */
body.portrait-mode {
  background: #000 !important;
  overflow: hidden !important;
}
body.portrait-mode .stage {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  transform-origin: center center !important;
  border-radius: 0 !important;
}

/* 右侧边栏：滚动区+固定播放器 */
.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel {
  display: flex !important;
  flex-direction: column !important;
  height: 100% !important;
  overflow: hidden !important;
}
.panel-scroll-area {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.panel-scroll-area::-webkit-scrollbar { width: 4px; }
.panel-scroll-area::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
}
.panel-players {
  flex: 0 0 auto;
  padding-top: 10px;
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.panel-players .explain-card:last-child { margin-bottom: 0; }

</style>
</head>
<body>
<div class="hint-text">已自动旋转为横屏模式<br>建议横屏观看效果更佳</div>
</div>


<div class="header">
  <h1>🧭 相对位置·方向相反距离一样</h1>
  <div class="score-box">⭐ <span id="score">0</span> 分</div>
</div>

<div class="main-container">
  <div class="left-area">
    <div class="compass-title" id="compassTitle">以恒恒家为参照点</div>
    <div class="compass-container">
      <svg class="compass-svg" viewBox="0 0 380 320" id="compassSvg">
        <g id="compassBase"></g>
        <g id="angleArcs"></g>
        <g id="locations"></g>
        <g id="labels"></g>
      </svg>
    </div>
    <button class="btn-switch" onclick="switchReference()">🔄 切换参照点</button>
  </div>

  <div class="right-panel">
    <div class="task-card">
      <h3>📋 第(1)问</h3>
      <div class="task-text">
        以恒恒家为参照点，美美家在恒恒家的(<input type="text" id="q1a">)偏(<input type="text" id="q1b">)(<input type="text" id="q1c">°)方向上，距离是(<input type="text" id="q1d">)m。
      </div>
      <button class="btn-verify" onclick="verifyQ1()">验证</button>
      <div class="feedback" id="fb1"></div>
    </div>

    <div class="task-card">
      <h3>📋 第(2)问</h3>
      <div class="task-text">
        以美美家为参照点，恒恒家在美美家的(<input type="text" id="q2a">)偏(<input type="text" id="q2b">)(<input type="text" id="q2c">°)方向上，距离是(<input type="text" id="q2d">)m。
      </div>
      <button class="btn-verify" onclick="verifyQ2()">验证</button>
      <div class="feedback" id="fb2"></div>
    </div>

    <div class="conclusion-box">
      <h4>💡 规律总结</h4>
      <p>描述相对位置关系时，方向<span style="color:#ff6b9d;font-weight:bold;">相反</span>，距离<span style="color:#00ff88;font-weight:bold;">一样</span>。</p>
    </div>

    <div class="player-card">
      <div class="player-title listen">🎧 听题·动手做</div>
      <div class="player-controls">
        <button class="play-btn" id="listenBtn" onclick="toggleListen()">▶</button>
        <div class="progress-bar" onclick="seekListen(event)">
          <div class="progress-fill" id="listenProgress"></div>
        </div>
        <div class="time-display" id="listenTime">0:00 / 0:00</div>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title explain">📖 听讲·老师做</div>
      <div class="player-controls">
        <button class="play-btn" id="explainBtn" onclick="toggleExplain()">▶</button>
        <div class="progress-bar" onclick="seekExplain(event)">
          <div class="progress-fill" id="explainProgress"></div>
        </div>
        <div class="time-display" id="explainTime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-content">
    <h2>🎉 完成啦！</h2>
    <p>你已经完成了所有题目，来听听老师的讲解吧！</p>
    <button class="overlay-btn" onclick="playExplainFromOverlay()">📖 听讲·老师做</button>
  </div>
</div>

<audio id="listenAudio" src="audio/intro.mp3" preload="metadata"></audio>
<audio id="explainAudio" src="audio/explain.mp3" preload="metadata"></audio>

<script>
let currentReference = 'hengheng';
let score = 0;
let q1done = false, q2done = false;
let correctAnswersShown = false;

const HENGHENG = {x: 100, y: 80};
const MEIMEI = {x: 280, y: 220};

function initCompass() {
  const base = document.getElementById('compassBase');
  
  const dirs = [
    {name: '北', x: 190, y: 20},
    {name: '南', x: 190, y: 300},
    {name: '西', x: 20, y: 160},
    {name: '东', x: 360, y: 160}
  ];
  dirs.forEach(d => {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', d.x);
    text.setAttribute('y', d.y);
    text.setAttribute('class', 'direction-label');
    text.textContent = d.name;
    base.appendChild(text);
  });
  
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', HENGHENG.x);
  line.setAttribute('y1', HENGHENG.y);
  line.setAttribute('x2', MEIMEI.x);
  line.setAttribute('y2', MEIMEI.y);
  line.setAttribute('class', 'distance-line');
  base.appendChild(line);
  
  const midX = (HENGHENG.x + MEIMEI.x) / 2;
  const midY = (HENGHENG.y + MEIMEI.y) / 2;
  const distText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  distText.setAttribute('x', midX);
  distText.setAttribute('y', midY - 10);
  distText.setAttribute('class', 'distance-text');
  distText.setAttribute('text-anchor', 'middle');
  distText.textContent = '500m';
  base.appendChild(distText);
  
  drawLocations();
  drawAngle();
}

function drawLocations() {
  const locs = document.getElementById('locations');
  const labels = document.getElementById('labels');
  locs.innerHTML = '';
  labels.innerHTML = '';
  
  const hMarker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  hMarker.setAttribute('cx', HENGHENG.x);
  hMarker.setAttribute('cy', HENGHENG.y);
  hMarker.setAttribute('r', currentReference === 'hengheng' ? 12 : 9);
  hMarker.setAttribute('class', 'location-marker' + (currentReference === 'hengheng' ? ' reference' : ''));
  locs.appendChild(hMarker);
  
  const hLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  hLabel.setAttribute('x', HENGHENG.x);
  hLabel.setAttribute('y', HENGHENG.y - 20);
  hLabel.setAttribute('class', 'location-label');
  hLabel.textContent = '恒恒家';
  labels.appendChild(hLabel);
  
  const mMarker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  mMarker.setAttribute('cx', MEIMEI.x);
  mMarker.setAttribute('cy', MEIMEI.y);
  mMarker.setAttribute('r', currentReference === 'meimei' ? 12 : 9);
  mMarker.setAttribute('class', 'location-marker' + (currentReference === 'meimei' ? ' reference' : ''));
  locs.appendChild(mMarker);
  
  const mLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  mLabel.setAttribute('x', MEIMEI.x);
  mLabel.setAttribute('y', MEIMEI.y + 25);
  mLabel.setAttribute('class', 'location-label');
  mLabel.textContent = '美美家';
  labels.appendChild(mLabel);
}

function drawAngle() {
  const arcs = document.getElementById('angleArcs');
  arcs.innerHTML = '';
  
  if (currentReference === 'hengheng') {
    const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const r = 40;
    const startX = HENGHENG.x;
    const startY = HENGHENG.y + r;
    const endAngle = Math.atan2(MEIMEI.y - HENGHENG.y, MEIMEI.x - HENGHENG.x);
    const endX = HENGHENG.x + r * Math.cos(endAngle);
    const endY = HENGHENG.y + r * Math.sin(endAngle);
    arc.setAttribute('d', `M ${startX} ${startY} A ${r} ${r} 0 0 1 ${endX} ${endY}`);
    arc.setAttribute('class', 'angle-arc');
    arcs.appendChild(arc);
    
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', HENGHENG.x + 35);
    text.setAttribute('y', HENGHENG.y + 30);
    text.setAttribute('class', 'angle-text');
    text.textContent = '40°';
    arcs.appendChild(text);
  } else {
    const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const r = 40;
    const startX = MEIMEI.x;
    const startY = MEIMEI.y - r;
    const endAngle = Math.atan2(HENGHENG.y - MEIMEI.y, HENGHENG.x - MEIMEI.x);
    const endX = MEIMEI.x + r * Math.cos(endAngle);
    const endY = MEIMEI.y + r * Math.sin(endAngle);
    arc.setAttribute('d', `M ${startX} ${startY} A ${r} ${r} 0 0 1 ${endX} ${endY}`);
    arc.setAttribute('class', 'angle-arc');
    arc.setAttribute('stroke', '#00ff88');
    arcs.appendChild(arc);
    
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', MEIMEI.x - 45);
    text.setAttribute('y', MEIMEI.y - 25);
    text.setAttribute('class', 'angle-text');
    text.setAttribute('fill', '#00ff88');
    text.textContent = '40°';
    arcs.appendChild(text);
  }
}

function switchReference() {
  currentReference = currentReference === 'hengheng' ? 'meimei' : 'hengheng';
  document.getElementById('compassTitle').textContent = 
    currentReference === 'hengheng' ? '以恒恒家为参照点' : '以美美家为参照点';
  drawLocations();
  drawAngle();
  addScore(2);
}

function verifyQ1() {
  if (q1done) return;
  const a = document.getElementById('q1a').value;
  const b = document.getElementById('q1b').value;
  const c = document.getElementById('q1c').value;
  const d = document.getElementById('q1d').value;
  const fb = document.getElementById('fb1');
  if ((a === '南' && b === '东' || a === '东' && b === '南') && c === '40' && d === '500') {
    fb.textContent = '✅ 正确！美美家在恒恒家南偏东40°方向，距离500m';
    fb.className = 'feedback correct';
    q1done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，以恒恒家为参照点，美美家在哪个方向？';
    fb.className = 'feedback wrong';
  }
}

function verifyQ2() {
  if (q2done) return;
  const a = document.getElementById('q2a').value;
  const b = document.getElementById('q2b').value;
  const c = document.getElementById('q2c').value;
  const d = document.getElementById('q2d').value;
  const fb = document.getElementById('fb2');
  if ((a === '北' && b === '西' || a === '西' && b === '北') && c === '40' && d === '500') {
    fb.textContent = '✅ 正确！恒恒家在美美家北偏西40°方向，距离500m';
    fb.className = 'feedback correct';
    q2done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，以美美家为参照点，恒恒家在哪个方向？';
    fb.className = 'feedback wrong';
  }
}

function checkComplete() {
  if (q1done && q2done) {
    setTimeout(() => {
      document.getElementById('completeOverlay').classList.add('show');
    }, 500);
  }
}

function addScore(points) {
  score += points;
  document.getElementById('score').textContent = score;
}

// 双播放器逻辑
const listenAudio = document.getElementById('listenAudio');
const explainAudio = document.getElementById('explainAudio');
let listenPlaying = false;
let explainPlaying = false;

function initDualPlayers() {
  listenAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('listenTime').textContent = '0:00 / ' + formatTime(listenAudio.duration);
  });
  explainAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('explainTime').textContent = '0:00 / ' + formatTime(explainAudio.duration);
  });
  listenAudio.addEventListener('timeupdate', updateListenProgress);
  explainAudio.addEventListener('timeupdate', updateExplainProgress);
  listenAudio.addEventListener('ended', () => {
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  });
  explainAudio.addEventListener('ended', () => {
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  });
}

function toggleListen() {
  if (listenPlaying) {
    listenAudio.pause();
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  } else {
    if (explainPlaying) toggleExplain();
    listenAudio.play();
    listenPlaying = true;
    document.getElementById('listenBtn').textContent = '⏸';
    document.getElementById('listenBtn').classList.add('playing');
  }
}

function toggleExplain() {
  if (explainPlaying) {
    explainAudio.pause();
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  } else {
    if (listenPlaying) toggleListen();
    explainAudio.play();
    explainPlaying = true;
    document.getElementById('explainBtn').textContent = '⏸';
    document.getElementById('explainBtn').classList.add('playing');
    if (!correctAnswersShown) showCorrectAnswers();
  }
}

function playExplainFromOverlay() {
  document.getElementById('completeOverlay').classList.remove('show');
  listenAudio.pause();
  listenAudio.currentTime = 0;
  listenPlaying = false;
  document.getElementById('listenBtn').textContent = '▶';
  document.getElementById('listenBtn').classList.remove('playing');
  explainAudio.currentTime = 0;
  explainAudio.play();
  explainPlaying = true;
  document.getElementById('explainBtn').textContent = '⏸';
  document.getElementById('explainBtn').classList.add('playing');
  if (!correctAnswersShown) showCorrectAnswers();
}

function showCorrectAnswers() {
  correctAnswersShown = true;
  document.getElementById('q1a').value = '南';
  document.getElementById('q1b').value = '东';
  document.getElementById('q1c').value = '40';
  document.getElementById('q1d').value = '500';
  document.getElementById('q2a').value = '北';
  document.getElementById('q2b').value = '西';
  document.getElementById('q2c').value = '40';
  document.getElementById('q2d').value = '500';
}

function seekListen(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  listenAudio.currentTime = percent * listenAudio.duration;
}

function seekExplain(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  explainAudio.currentTime = percent * explainAudio.duration;
}

function updateListenProgress() {
  const percent = (listenAudio.currentTime / listenAudio.duration) * 100;
  document.getElementById('listenProgress').style.width = percent + '%';
  document.getElementById('listenTime').textContent = formatTime(listenAudio.currentTime) + ' / ' + formatTime(listenAudio.duration);
}

function updateExplainProgress() {
  const percent = (explainAudio.currentTime / explainAudio.duration) * 100;
  document.getElementById('explainProgress').style.width = percent + '%';
  document.getElementById('explainTime').textContent = formatTime(explainAudio.currentTime) + ' / ' + formatTime(explainAudio.duration);
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

initCompass();
initDualPlayers();
</script>

<!-- ===== v2 竖屏自适应：旋转+缩放+右侧滚动+触摸坐标转换+drag模拟 ===== -->
<script>
(function(){
  var DESIGN_H = 720; // 设计参考高度，保证元素大小合适
  var scale = 1, isPortrait = false;
  var panelDone = false;

  function $(s, ctx){ return (ctx||document).querySelector(s); }
  function $$(s, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(s)); }

  /* ---- 1. 竖屏检测 + 旋转 + 整体缩放 ---- */
  function applyLayout(){
    var stage = document.getElementById('stage');
    if(!stage) return;
    var w = window.innerWidth, h = window.innerHeight;
    isPortrait = (h > w) && (w <= 900);

    if(isPortrait){
      var availW = h, availH = w;
      scale = availH / DESIGN_H; // 短边拉满，元素按设计参考高度缩放
      stage.style.width = (DESIGN_H * 16 / 9) + 'px';
      stage.style.height = DESIGN_H + 'px';
      stage.style.marginLeft = -(DESIGN_H * 16 / 9 / 2) + 'px';
      stage.style.marginTop = -(DESIGN_H / 2) + 'px';
      stage.style.transform = 'rotate(90deg) scale(' + scale + ')';
      document.body.classList.add('portrait-mode');
      rearrangePanel();
    } else {
      stage.style.width = '';
      stage.style.height = '';
      stage.style.marginLeft = '';
      stage.style.marginTop = '';
      stage.style.transform = '';
      document.body.classList.remove('portrait-mode');
    }
  }

  /* ---- 2. 右侧边栏重排：播放器固定底部，其余可滚动 ---- */
  function rearrangePanel(){
    if(panelDone) return;
    var panels = $$('.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel');
    panels.forEach(function(panel){
      var players = $$('.explain-card, .player-card, .audio-card', panel);
      if(players.length === 0) return;
      var scrollArea = document.createElement('div');
      scrollArea.className = 'panel-scroll-area';
      var playersArea = document.createElement('div');
      playersArea.className = 'panel-players';
      players.forEach(function(p){ playersArea.appendChild(p); });
      while(panel.firstChild){ scrollArea.appendChild(panel.firstChild); }
      panel.appendChild(scrollArea);
      panel.appendChild(playersArea);
    });
    panelDone = true;
  }

  /* ---- 3. 触摸坐标转换（逆旋转+逆缩放） ---- */
  function convertCoords(cx, cy){
    if(!isPortrait) return {x:cx, y:cy};
    var scx = window.innerWidth/2, scy = window.innerHeight/2;
    var dx = (cx - scx) / scale;
    var dy = (cy - scy) / scale;
    // 逆旋转（逆时针90度）
    return { x: scx - dy, y: scy + dx };
  }

  function fireMouse(type, target, x, y){
    var evt = new MouseEvent(type, {bubbles:true, cancelable:true, clientX:x, clientY:y, button:0});
    target.dispatchEvent(evt);
  }

  function isInRightPanel(el){
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('students-panel')||el.classList.contains('right-panel')||
         el.classList.contains('info-panel')||el.classList.contains('answer-panel')||
         el.classList.contains('quiz-panel')||el.classList.contains('panel-scroll-area')||
         el.classList.contains('panel-players'))) return true;
      el = el.parentNode;
    }
    return false;
  }

  /* ---- 4. drag模拟状态 ---- */
  var dragSrc = null, lastDropTarget = null;

  function findDropTarget(x, y){
    var el = document.elementFromPoint(x, y);
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('seat')||el.classList.contains('drop-zone')||
         el.classList.contains('target')||el.classList.contains('cell')||
         el.getAttribute && el.getAttribute('data-drop') === '1')) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* ---- 5. 全局touch拦截（仅左侧交互区域） ---- */
  document.addEventListener('touchstart', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return; // 右侧边栏原生处理
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(!target) return;
    fireMouse('mousedown', target, coords.x, coords.y);
    // drag模拟
    if(target.getAttribute && target.getAttribute('draggable') === 'true'){
      dragSrc = target;
      var dt = new DataTransfer();
      try{
        var de = new DragEvent('dragstart', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt});
        target.dispatchEvent(de);
      }catch(err){}
    }
    if(target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') target.focus();
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y);
    if(target) fireMouse('mousemove', target, coords.x, coords.y);
    // drag模拟：dragover / dragleave
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget !== lastDropTarget){
        if(lastDropTarget){
          try{ lastDropTarget.dispatchEvent(new DragEvent('dragleave', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        if(dropTarget){
          try{ dropTarget.dispatchEvent(new DragEvent('dragover', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        lastDropTarget = dropTarget;
      }
    }
  }, {passive:false});

  document.addEventListener('touchend', function(e){
    if(!isPortrait) return;
    var t = e.changedTouches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(target){
      fireMouse('mouseup', target, coords.x, coords.y);
      fireMouse('click', target, coords.x, coords.y);
    }
    // drag模拟：drop / dragend
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget){
        try{
          var dt = new DataTransfer();
          dropTarget.dispatchEvent(new DragEvent('drop', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt}));
        }catch(err){}
      }
      try{ dragSrc.dispatchEvent(new DragEvent('dragend', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
      dragSrc = null;
      lastDropTarget = null;
    }
  }, {passive:false});

  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', function(){ setTimeout(applyLayout, 150); });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyLayout);
  } else {
    applyLayout();
  }
})();
</script>

</body>
