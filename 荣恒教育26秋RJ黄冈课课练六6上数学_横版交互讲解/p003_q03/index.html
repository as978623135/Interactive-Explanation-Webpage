<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向与位置·以学校为参照点</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(0,0,0,0.3);
}
.header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  color: #1a1a2e;
}
.main-container {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 60px);
}
.left-area {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
 position: relative; overflow: hidden;}
.compass-title {
  font-size: 18px;
  color: #ffd700;
  margin-bottom: 12px;
  text-align: center;
}
.compass-container {
  position: relative;
  
  
 transform: scale(1.4); transform-origin: center;}
.compass-svg {
  width: 100%;
  height: 100%;
}
.direction-label {
  font-size: 16px;
  font-weight: bold;
  fill: #ffd700;
  text-anchor: middle;
}
.location-marker {
  fill: #ff6b9d;
  stroke: #fff;
  stroke-width: 2;
  cursor: pointer;
  transition: all 0.2s;
}
.location-marker:hover {
  r: 12;
  filter: brightness(1.2);
}
.location-label {
  font-size: 14px;
  fill: #fff;
  font-weight: bold;
  text-anchor: middle;
  pointer-events: none;
}
.school-marker {
  fill: #ffd700;
  stroke: #fff;
  stroke-width: 2;
}
.angle-arc {
  fill: none;
  stroke: #00bfff;
  stroke-width: 2;
  stroke-dasharray: 4,4;
}
.angle-text {
  font-size: 12px;
  fill: #00bfff;
  font-weight: bold;
}
.scale-bar {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.scale-line {
  width: 60px;
  height: 4px;
  background: linear-gradient(90deg, #ff6b9d, #ff8c00);
  border-radius: 2px;
}
.scale-text {
  font-size: 13px;
  color: #aaa;
}
.right-panel {
  width: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.task-card {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
  border-left: 4px solid #ffd700;
}
.task-card h3 {
  font-size: 15px;
  color: #ffd700;
  margin-bottom: 10px;
}
.task-text {
  font-size: 13px;
  line-height: 1.8;
  color: #ddd;
  margin-bottom: 10px;
}
.task-text input {
  width: 45px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #555;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 13px;
  text-align: center;
  margin: 0 2px;
}
.task-text input:focus {
  outline: none;
  border-color: #ffd700;
}
.btn-verify {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #00ff88, #00c853);
  color: #1a1a2e;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  margin-top: 8px;
}
.feedback {
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
}
.feedback.correct { color: #00ff88; }
.feedback.wrong { color: #ff6b6b; }
.player-card {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
}
.player-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.player-title.listen { color: #00bfff; }
.player-title.explain { color: #ff8c00; }
.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00bfff, #0080ff);
  border-radius: 3px;
  width: 0%;
}
.time-display {
  font-size: 12px;
  color: #aaa;
  min-width: 80px;
  text-align: right;
}
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  border: 2px solid #ffd700;
}
.overlay-content h2 { font-size: 28px; color: #ffd700; margin-bottom: 16px; }
.overlay-content p { font-size: 16px; color: #ddd; margin-bottom: 24px; }
.overlay-btn {
  padding: 12px 32px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff8c00, #ff6b00);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

@media (orientation: portrait) and (max-width: 900px) {
  body {
    overflow: hidden;
    background: #000;
  }
  .stage {
    transform: rotate(90deg);
    transform-origin: center center;
    width: 100vh !important;
    height: 100vw !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    margin-left: -50vh !important;
    margin-top: -50vw !important;
    border-radius: 0 !important;
  }
  /* 旋转提示（可选，显示3秒后淡出） */
  }

/* 旋转提示层 */
50% { transform: rotate(90deg); }
}
}


/* ===== v2 竖屏自适应（JS控制旋转+整体缩放） ===== */
body.portrait-mode {
  background: #000 !important;
  overflow: visible !important;
}
html { overflow: hidden !important; }
body.portrait-mode .stage {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  transform-origin: center center !important;
  border-radius: 0 !important;
}

/* 右侧边栏：滚动区+固定播放器 */
.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel {
  display: flex !important;
  flex-direction: column !important;
  height: 100% !important;
  overflow: hidden !important;
}
.panel-scroll-area {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.panel-scroll-area::-webkit-scrollbar { width: 4px; }
.panel-scroll-area::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
}
.panel-players {
  flex: 0 0 auto;
  padding-top: 10px;
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.panel-players .explain-card:last-child { margin-bottom: 0; }

</style>
</head>
<body>
<div class="hint-text">已自动旋转为横屏模式<br>建议横屏观看效果更佳</div>
</div>


<div class="header">
  <h1>🧭 方向与位置·以学校为参照点</h1>
  <div class="score-box">⭐ <span id="score">0</span> 分</div>
</div>

<div class="main-container">
  <div class="left-area">
    <div class="compass-title">以学校为参照点的方位图</div>
    <div class="compass-container">
      <svg class="compass-svg" viewBox="0 0 380 380" id="compassSvg">
        <g id="compassBase"></g>
        <g id="angleArcs"></g>
        <g id="locations"></g>
        <g id="labels"></g>
      </svg>
    </div>
    <div class="scale-bar">
      <div class="scale-line"></div>
      <div class="scale-text">比例尺：1段 = 400m</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="task-card">
      <h3>📋 第(1)问</h3>
      <div class="task-text">
        荣荣家在学校的(<input type="text" id="q1a">)偏(<input type="text" id="q1b">)(<input type="text" id="q1c">)°方向上，距离是(<input type="text" id="q1d">)m。
      </div>
      <button class="btn-verify" onclick="verifyQ1()">验证</button>
      <div class="feedback" id="fb1"></div>
    </div>

    <div class="task-card">
      <h3>📋 第(2)问</h3>
      <div class="task-text">
        明轩家在学校的(<input type="text" id="q2a">)方向上，距离是(<input type="text" id="q2b">)m。
      </div>
      <button class="btn-verify" onclick="verifyQ2()">验证</button>
      <div class="feedback" id="fb2"></div>
    </div>

    <div class="task-card">
      <h3>📋 第(3)问</h3>
      <div class="task-text">
        在学校南偏东45°方向上，距离600m的是(<input type="text" id="q3a" style="width:70px">)。
      </div>
      <button class="btn-verify" onclick="verifyQ3()">验证</button>
      <div class="feedback" id="fb3"></div>
    </div>

    <div class="player-card">
      <div class="player-title listen">🎧 听题·动手做</div>
      <div class="player-controls">
        <button class="play-btn" id="listenBtn" onclick="toggleListen()">▶</button>
        <div class="progress-bar" onclick="seekListen(event)">
          <div class="progress-fill" id="listenProgress"></div>
        </div>
        <div class="time-display" id="listenTime">0:00 / 0:00</div>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title explain">📖 听讲·老师做</div>
      <div class="player-controls">
        <button class="play-btn" id="explainBtn" onclick="toggleExplain()">▶</button>
        <div class="progress-bar" onclick="seekExplain(event)">
          <div class="progress-fill" id="explainProgress"></div>
        </div>
        <div class="time-display" id="explainTime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-content">
    <h2>🎉 完成啦！</h2>
    <p>你已经完成了所有题目，来听听老师的讲解吧！</p>
    <button class="overlay-btn" onclick="playExplainFromOverlay()">📖 听讲·老师做</button>
  </div>
</div>

<audio id="listenAudio" src="audio/intro.mp3" preload="metadata"></audio>
<audio id="explainAudio" src="audio/explain.mp3" preload="metadata"></audio>

<script>
const CX = 190, CY = 190;
let score = 0;
let q1done = false, q2done = false, q3done = false;
let correctAnswersShown = false;

const locations = [
  {name: '荣荣家', angle: -130, dist: 80, color: '#ff6b9d'},
  {name: '明轩家', angle: 180, dist: 80, color: '#00bfff'},
  {name: '恒恒家', angle: -30, dist: 120, color: '#00ff88'},
  {name: '美美家', angle: 45, dist: 120, color: '#ffd700'}
];

function polarToCartesian(angleDeg, dist) {
  const rad = angleDeg * Math.PI / 180;
  return {
    x: CX + dist * Math.cos(rad),
    y: CY + dist * Math.sin(rad)
  };
}

function initCompass() {
  const base = document.getElementById('compassBase');
  
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', CX);
  circle.setAttribute('cy', CY);
  circle.setAttribute('r', '150');
  circle.setAttribute('fill', 'rgba(255,255,255,0.03)');
  circle.setAttribute('stroke', 'rgba(255,255,255,0.15)');
  circle.setAttribute('stroke-width', '2');
  base.appendChild(circle);
  
  const dirs = [
    {name: '北', angle: -90},
    {name: '南', angle: 90},
    {name: '西', angle: 180},
    {name: '东', angle: 0}
  ];
  dirs.forEach(d => {
    const pos = polarToCartesian(d.angle, 170);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x);
    text.setAttribute('y', pos.y + 5);
    text.setAttribute('class', 'direction-label');
    text.textContent = d.name;
    base.appendChild(text);
    
    const linePos = polarToCartesian(d.angle, 150);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', CX);
    line.setAttribute('y1', CY);
    line.setAttribute('x2', linePos.x);
    line.setAttribute('y2', linePos.y);
    line.setAttribute('stroke', 'rgba(255,255,255,0.1)');
    line.setAttribute('stroke-width', '1');
    base.appendChild(line);
  });
  
  const school = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  school.setAttribute('cx', CX);
  school.setAttribute('cy', CY);
  school.setAttribute('r', '10');
  school.setAttribute('class', 'school-marker');
  document.getElementById('locations').appendChild(school);
  
  const schoolLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  schoolLabel.setAttribute('x', CX);
  schoolLabel.setAttribute('y', CY + 25);
  schoolLabel.setAttribute('class', 'location-label');
  schoolLabel.setAttribute('fill', '#ffd700');
  schoolLabel.textContent = '学校';
  document.getElementById('labels').appendChild(schoolLabel);
  
  locations.forEach(loc => {
    const pos = polarToCartesian(loc.angle, loc.dist);
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    marker.setAttribute('cx', pos.x);
    marker.setAttribute('cy', pos.y);
    marker.setAttribute('r', '9');
    marker.setAttribute('class', 'location-marker');
    marker.setAttribute('fill', loc.color);
    marker.addEventListener('click', () => highlightLocation(loc.name));
    document.getElementById('locations').appendChild(marker);
    
    const labelPos = polarToCartesian(loc.angle, loc.dist + 20);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', labelPos.x);
    label.setAttribute('y', labelPos.y + 5);
    label.setAttribute('class', 'location-label');
    label.textContent = loc.name;
    document.getElementById('labels').appendChild(label);
  });
  
  const arcs = document.getElementById('angleArcs');
  const arc1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const r = 40;
  const startAngle = 180;
  const endAngle = -130;
  const start = polarToCartesian(startAngle, r);
  const end = polarToCartesian(endAngle, r);
  arc1.setAttribute('d', `M ${start.x} ${start.y} A ${r} ${r} 0 0 0 ${end.x} ${end.y}`);
  arc1.setAttribute('class', 'angle-arc');
  arcs.appendChild(arc1);
  
  const angleText1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  const textPos = polarToCartesian(-155, 55);
  angleText1.setAttribute('x', textPos.x);
  angleText1.setAttribute('y', textPos.y);
  angleText1.setAttribute('class', 'angle-text');
  angleText1.textContent = '40°';
  arcs.appendChild(angleText1);
  
  const arc2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const start2 = polarToCartesian(0, 50);
  const end2 = polarToCartesian(-30, 50);
  arc2.setAttribute('d', `M ${start2.x} ${start2.y} A 50 50 0 0 0 ${end2.x} ${end2.y}`);
  arc2.setAttribute('class', 'angle-arc');
  arc2.setAttribute('stroke', '#00ff88');
  arcs.appendChild(arc2);
  
  const angleText2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  const textPos2 = polarToCartesian(-15, 65);
  angleText2.setAttribute('x', textPos2.x);
  angleText2.setAttribute('y', textPos2.y);
  angleText2.setAttribute('class', 'angle-text');
  angleText2.setAttribute('fill', '#00ff88');
  angleText2.textContent = '30°';
  arcs.appendChild(angleText2);
}

function highlightLocation(name) {
  addScore(2);
}

function verifyQ1() {
  if (q1done) return;
  const a = document.getElementById('q1a').value;
  const b = document.getElementById('q1b').value;
  const c = document.getElementById('q1c').value;
  const d = document.getElementById('q1d').value;
  const fb = document.getElementById('fb1');
  if ((a === '西' && b === '北' || a === '北' && b === '西') && c === '40' && d === '400') {
    fb.textContent = '✅ 正确！荣荣家在学校西偏北40°方向，距离400m';
    fb.className = 'feedback correct';
    q1done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，荣荣家在西和北之间，角度是40°';
    fb.className = 'feedback wrong';
  }
}

function verifyQ2() {
  if (q2done) return;
  const a = document.getElementById('q2a').value;
  const b = document.getElementById('q2b').value;
  const fb = document.getElementById('fb2');
  if (a === '正西' && b === '400') {
    fb.textContent = '✅ 正确！明轩家在学校正西方向，距离400m';
    fb.className = 'feedback correct';
    q2done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，明轩家在学校的正左边';
    fb.className = 'feedback wrong';
  }
}

function verifyQ3() {
  if (q3done) return;
  const a = document.getElementById('q3a').value;
  const fb = document.getElementById('fb3');
  if (a === '美美家' || a === '美美') {
    fb.textContent = '✅ 正确！美美家在学校南偏东45°方向，距离600m';
    fb.className = 'feedback correct';
    q3done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，南偏东45°就是东南方向';
    fb.className = 'feedback wrong';
  }
}

function checkComplete() {
  if (q1done && q2done && q3done) {
    setTimeout(() => {
      document.getElementById('completeOverlay').classList.add('show');
    }, 500);
  }
}

function addScore(points) {
  score += points;
  document.getElementById('score').textContent = score;
}

// 双播放器逻辑
const listenAudio = document.getElementById('listenAudio');
const explainAudio = document.getElementById('explainAudio');
let listenPlaying = false;
let explainPlaying = false;

function initDualPlayers() {
  listenAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('listenTime').textContent = '0:00 / ' + formatTime(listenAudio.duration);
  });
  explainAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('explainTime').textContent = '0:00 / ' + formatTime(explainAudio.duration);
  });
  listenAudio.addEventListener('timeupdate', updateListenProgress);
  explainAudio.addEventListener('timeupdate', updateExplainProgress);
  listenAudio.addEventListener('ended', () => {
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  });
  explainAudio.addEventListener('ended', () => {
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  });
}

function toggleListen() {
  if (listenPlaying) {
    listenAudio.pause();
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  } else {
    if (explainPlaying) toggleExplain();
    listenAudio.play();
    listenPlaying = true;
    document.getElementById('listenBtn').textContent = '⏸';
    document.getElementById('listenBtn').classList.add('playing');
  }
}

function toggleExplain() {
  if (explainPlaying) {
    explainAudio.pause();
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  } else {
    if (listenPlaying) toggleListen();
    explainAudio.play();
    explainPlaying = true;
    document.getElementById('explainBtn').textContent = '⏸';
    document.getElementById('explainBtn').classList.add('playing');
    if (!correctAnswersShown) showCorrectAnswers();
  }
}

function playExplainFromOverlay() {
  document.getElementById('completeOverlay').classList.remove('show');
  listenAudio.pause();
  listenAudio.currentTime = 0;
  listenPlaying = false;
  document.getElementById('listenBtn').textContent = '▶';
  document.getElementById('listenBtn').classList.remove('playing');
  explainAudio.currentTime = 0;
  explainAudio.play();
  explainPlaying = true;
  document.getElementById('explainBtn').textContent = '⏸';
  document.getElementById('explainBtn').classList.add('playing');
  if (!correctAnswersShown) showCorrectAnswers();
}

function showCorrectAnswers() {
  correctAnswersShown = true;
  document.getElementById('q1a').value = '西';
  document.getElementById('q1b').value = '北';
  document.getElementById('q1c').value = '40';
  document.getElementById('q1d').value = '400';
  document.getElementById('q2a').value = '正西';
  document.getElementById('q2b').value = '400';
  document.getElementById('q3a').value = '美美家';
}

function seekListen(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  listenAudio.currentTime = percent * listenAudio.duration;
}

function seekExplain(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  explainAudio.currentTime = percent * explainAudio.duration;
}

function updateListenProgress() {
  const percent = (listenAudio.currentTime / listenAudio.duration) * 100;
  document.getElementById('listenProgress').style.width = percent + '%';
  document.getElementById('listenTime').textContent = formatTime(listenAudio.currentTime) + ' / ' + formatTime(listenAudio.duration);
}

function updateExplainProgress() {
  const percent = (explainAudio.currentTime / explainAudio.duration) * 100;
  document.getElementById('explainProgress').style.width = percent + '%';
  document.getElementById('explainTime').textContent = formatTime(explainAudio.currentTime) + ' / ' + formatTime(explainAudio.duration);
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

initCompass();
initDualPlayers();
</script>

<!-- ===== v2 竖屏自适应：旋转+缩放+右侧滚动+触摸坐标转换+drag模拟 ===== -->
<script>
(function(){
  var DESIGN_H = 720; // 设计参考高度，保证元素大小合适
  var scale = 1, isPortrait = false;
  var panelDone = false;

  function $(s, ctx){ return (ctx||document).querySelector(s); }
  function $$(s, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(s)); }

  /* ---- 1. 竖屏检测 + 旋转 + 整体缩放 ---- */
  function applyLayout(){
    var stage = document.getElementById('stage');
    if(!stage) return;
    var w = window.innerWidth, h = window.innerHeight;
    isPortrait = (h > w) && (w <= 900);

    if(isPortrait){
      var availW = h, availH = w;
      scale = availH / DESIGN_H; // 短边拉满，元素按设计参考高度缩放
      stage.style.width = (DESIGN_H * 16 / 9) + 'px';
      stage.style.height = DESIGN_H + 'px';
      stage.style.marginLeft = -(DESIGN_H * 16 / 9 / 2) + 'px';
      stage.style.marginTop = -(DESIGN_H / 2) + 'px';
      stage.style.transform = 'rotate(90deg) scale(' + scale + ')';
      document.body.classList.add('portrait-mode');
      rearrangePanel();
    } else {
      stage.style.width = '';
      stage.style.height = '';
      stage.style.marginLeft = '';
      stage.style.marginTop = '';
      stage.style.transform = '';
      document.body.classList.remove('portrait-mode');
    }
  }

  /* ---- 2. 右侧边栏重排：播放器固定底部，其余可滚动 ---- */
  function rearrangePanel(){
    if(panelDone) return;
    var panels = $$('.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel');
    panels.forEach(function(panel){
      var players = $$('.explain-card, .player-card, .audio-card', panel);
      if(players.length === 0) return;
      var scrollArea = document.createElement('div');
      scrollArea.className = 'panel-scroll-area';
      var playersArea = document.createElement('div');
      playersArea.className = 'panel-players';
      players.forEach(function(p){ playersArea.appendChild(p); });
      while(panel.firstChild){ scrollArea.appendChild(panel.firstChild); }
      panel.appendChild(scrollArea);
      panel.appendChild(playersArea);
    });
    panelDone = true;
  }

  /* ---- 3. 触摸坐标转换（逆旋转+逆缩放） ---- */
  function convertCoords(cx, cy){
    if(!isPortrait) return {x:cx, y:cy};
    var scx = window.innerWidth/2, scy = window.innerHeight/2;
    var dx = (cx - scx) / scale;
    var dy = (cy - scy) / scale;
    // 逆旋转（逆时针90度）
    return { x: scx - dy, y: scy + dx };
  }

  function fireMouse(type, target, x, y){
    var evt = new MouseEvent(type, {bubbles:true, cancelable:true, clientX:x, clientY:y, button:0});
    target.dispatchEvent(evt);
  }

  function isInRightPanel(el){
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('students-panel')||el.classList.contains('right-panel')||
         el.classList.contains('info-panel')||el.classList.contains('answer-panel')||
         el.classList.contains('quiz-panel')||el.classList.contains('panel-scroll-area')||
         el.classList.contains('panel-players'))) return true;
      el = el.parentNode;
    }
    return false;
  }

  /* ---- 4. drag模拟状态 ---- */
  var dragSrc = null, lastDropTarget = null;

  function findDropTarget(x, y){
    var el = document.elementFromPoint(x, y);
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('seat')||el.classList.contains('drop-zone')||
         el.classList.contains('target')||el.classList.contains('cell')||
         el.getAttribute && el.getAttribute('data-drop') === '1')) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* ---- 5. 全局touch拦截（仅左侧交互区域） ---- */
  document.addEventListener('touchstart', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return; // 右侧边栏原生处理
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(!target) return;
    fireMouse('mousedown', target, coords.x, coords.y);
    // drag模拟
    if(target.getAttribute && target.getAttribute('draggable') === 'true'){
      dragSrc = target;
      var dt = new DataTransfer();
      try{
        var de = new DragEvent('dragstart', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt});
        target.dispatchEvent(de);
      }catch(err){}
    }
    if(target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') target.focus();
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y);
    if(target) fireMouse('mousemove', target, coords.x, coords.y);
    // drag模拟：dragover / dragleave
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget !== lastDropTarget){
        if(lastDropTarget){
          try{ lastDropTarget.dispatchEvent(new DragEvent('dragleave', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        if(dropTarget){
          try{ dropTarget.dispatchEvent(new DragEvent('dragover', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        lastDropTarget = dropTarget;
      }
    }
  }, {passive:false});

  document.addEventListener('touchend', function(e){
    if(!isPortrait) return;
    var t = e.changedTouches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(target){
      fireMouse('mouseup', target, coords.x, coords.y);
      fireMouse('click', target, coords.x, coords.y);
    }
    // drag模拟：drop / dragend
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget){
        try{
          var dt = new DataTransfer();
          dropTarget.dispatchEvent(new DragEvent('drop', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt}));
        }catch(err){}
      }
      try{ dragSrc.dispatchEvent(new DragEvent('dragend', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
      dragSrc = null;
      lastDropTarget = null;
    }
  }, {passive:false});

  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', function(){ setTimeout(applyLayout, 150); });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyLayout);
  } else {
    applyLayout();
  }
})();
</script>

</body>
