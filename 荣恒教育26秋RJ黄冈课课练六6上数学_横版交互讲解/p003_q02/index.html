<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向与距离·数对表示位置</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(0,0,0,0.3);
}
.header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  color: #1a1a2e;
}
.main-container {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 60px);
}
.left-area {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
 position: relative; overflow: hidden;}
.grid-title {
  font-size: 18px;
  color: #ffd700;
  margin-bottom: 12px;
  text-align: center;
}
.grid-container {
  position: relative;
 transform: scale(1.4); transform-origin: center;}
.grid-svg {
  display: block;
 width: 100%; height: 100%;}
.grid-cell {
  fill: rgba(255,255,255,0.05);
  stroke: rgba(255,255,255,0.15);
  stroke-width: 1;
}
.grid-cell.highlight {
  fill: rgba(0,191,255,0.2);
}
.grid-cell.start {
  fill: rgba(255,107,157,0.3);
}
.grid-cell.end {
  fill: rgba(0,255,136,0.3);
}
.axis-label {
  font-size: 12px;
  fill: #888;
  text-anchor: middle;
}
.point-marker {
  fill: #ff6b9d;
  stroke: #fff;
  stroke-width: 2;
}
.point-marker.end {
  fill: #00ff88;
}
.point-label {
  font-size: 13px;
  fill: #fff;
  font-weight: bold;
  text-anchor: middle;
}
.path-line {
  stroke: #ffd700;
  stroke-width: 3;
  stroke-dasharray: 8,4;
  fill: none;
  marker-end: url(#arrow);
}
.north-arrow {
  fill: #ff6b9d;
}
.btn-show-path {
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}
.btn-show-path:hover { transform: scale(1.05); }
.btn-show-path:disabled {
  background: #555;
  cursor: not-allowed;
  transform: none;
}
.right-panel {
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.task-card {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
  border-left: 4px solid #ffd700;
}
.task-card h3 {
  font-size: 15px;
  color: #ffd700;
  margin-bottom: 10px;
}
.task-text {
  font-size: 13px;
  line-height: 1.7;
  color: #ddd;
  margin-bottom: 12px;
}
.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0;
}
.input-row input {
  width: 50px;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid #555;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 14px;
  text-align: center;
}
.input-row input:focus {
  outline: none;
  border-color: #ffd700;
}
.btn-verify {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #00ff88, #00c853);
  color: #1a1a2e;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
}
.feedback {
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
}
.feedback.correct { color: #00ff88; }
.feedback.wrong { color: #ff6b6b; }
.hint {
  font-size: 12px;
  color: #888;
  margin-top: 8px;
}
.player-card {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
}
.player-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.player-title.listen { color: #00bfff; }
.player-title.explain { color: #ff8c00; }
.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00bfff, #0080ff);
  border-radius: 3px;
  width: 0%;
}
.time-display {
  font-size: 12px;
  color: #aaa;
  min-width: 80px;
  text-align: right;
}
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  border: 2px solid #ffd700;
}
.overlay-content h2 { font-size: 28px; color: #ffd700; margin-bottom: 16px; }
.overlay-content p { font-size: 16px; color: #ddd; margin-bottom: 24px; }
.overlay-btn {
  padding: 12px 32px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff8c00, #ff6b00);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

@media (orientation: portrait) and (max-width: 900px) {
  body {
    overflow: hidden;
    background: #000;
  }
  .stage {
    transform: rotate(90deg);
    transform-origin: center center;
    width: 100vh !important;
    height: 100vw !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    margin-left: -50vh !important;
    margin-top: -50vw !important;
    border-radius: 0 !important;
  }
  /* 旋转提示（可选，显示3秒后淡出） */
  }

/* 旋转提示层 */
50% { transform: rotate(90deg); }
}
}


/* ===== v2 竖屏自适应（JS控制旋转+整体缩放） ===== */
body.portrait-mode {
  background: #000 !important;
  overflow: hidden !important;
}
body.portrait-mode .stage {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  transform-origin: center center !important;
  border-radius: 0 !important;
}

/* 右侧边栏：滚动区+固定播放器 */
.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel {
  display: flex !important;
  flex-direction: column !important;
  height: 100% !important;
  overflow: hidden !important;
}
.panel-scroll-area {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.panel-scroll-area::-webkit-scrollbar { width: 4px; }
.panel-scroll-area::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
}
.panel-players {
  flex: 0 0 auto;
  padding-top: 10px;
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.panel-players .explain-card:last-child { margin-bottom: 0; }

</style>
</head>
<body>
<div class="hint-text">已自动旋转为横屏模式<br>建议横屏观看效果更佳</div>
</div>


<div class="header">
  <h1>🧭 方向与距离·数对表示位置</h1>
  <div class="score-box">⭐ <span id="score">0</span> 分</div>
</div>

<div class="main-container">
  <div class="left-area">
    <div class="grid-title">方格图（每个小正方形对角线长10m）</div>
    <div class="grid-container">
      <svg class="grid-svg" id="gridSvg" width="400" height="400" viewBox="0 0 400 400">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
          </marker>
        </defs>
        <g id="gridCells"></g>
        <g id="axisLabels"></g>
        <g id="pathLayer"></g>
        <g id="pointsLayer"></g>
        <g id="labelsLayer"></g>
      </svg>
    </div>
    <button class="btn-show-path" id="pathBtn" onclick="showPaths()">📍 显示移动路径</button>
  </div>

  <div class="right-panel">
    <div class="task-card">
      <h3>📋 第(1)问</h3>
      <div class="task-text">点(0,0)北偏东45°方向40m处是点( <input type="text" id="q1x" style="width:40px"> , <input type="text" id="q1y" style="width:40px"> )。</div>
      <div class="input-row">
        <button class="btn-verify" onclick="verifyQ1()">验证</button>
      </div>
      <div class="feedback" id="fb1"></div>
      <div class="hint">💡 40m = 4个对角线，北偏东45°=东北方向</div>
    </div>

    <div class="task-card">
      <h3>📋 第(2)问</h3>
      <div class="task-text">点(6,5)南偏西45°方向30m处是点( <input type="text" id="q2x" style="width:40px"> , <input type="text" id="q2y" style="width:40px"> )。</div>
      <div class="input-row">
        <button class="btn-verify" onclick="verifyQ2()">验证</button>
      </div>
      <div class="feedback" id="fb2"></div>
      <div class="hint">💡 30m = 3个对角线，南偏西45°=西南方向</div>
    </div>

    <div class="player-card">
      <div class="player-title listen">🎧 听题·动手做</div>
      <div class="player-controls">
        <button class="play-btn" id="listenBtn" onclick="toggleListen()">▶</button>
        <div class="progress-bar" onclick="seekListen(event)">
          <div class="progress-fill" id="listenProgress"></div>
        </div>
        <div class="time-display" id="listenTime">0:00 / 0:00</div>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title explain">📖 听讲·老师做</div>
      <div class="player-controls">
        <button class="play-btn" id="explainBtn" onclick="toggleExplain()">▶</button>
        <div class="progress-bar" onclick="seekExplain(event)">
          <div class="progress-fill" id="explainProgress"></div>
        </div>
        <div class="time-display" id="explainTime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-content">
    <h2>🎉 完成啦！</h2>
    <p>你已经完成了所有题目，来听听老师的讲解吧！</p>
    <button class="overlay-btn" onclick="playExplainFromOverlay()">📖 听讲·老师做</button>
  </div>
</div>

<audio id="listenAudio" src="audio/intro.mp3" preload="metadata"></audio>
<audio id="explainAudio" src="audio/explain.mp3" preload="metadata"></audio>

<script>
const CELL = 45;
const OFFSET = 40;
let score = 0;
let q1done = false;
let q2done = false;
let pathsShown = false;
let correctAnswersShown = false;

function gridToSvg(x, y) {
  return {
    x: OFFSET + x * CELL,
    y: OFFSET + (7 - y) * CELL
  };
}

function initGrid() {
  const cells = document.getElementById('gridCells');
  const labels = document.getElementById('axisLabels');
  
  for (let x = 0; x <= 7; x++) {
    for (let y = 0; y <= 7; y++) {
      const pos = gridToSvg(x, y);
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', pos.x - CELL/2);
      rect.setAttribute('y', pos.y - CELL/2);
      rect.setAttribute('width', CELL);
      rect.setAttribute('height', CELL);
      rect.setAttribute('class', 'grid-cell');
      rect.setAttribute('data-x', x);
      rect.setAttribute('data-y', y);
      cells.appendChild(rect);
    }
  }
  
  for (let x = 0; x <= 7; x++) {
    const pos = gridToSvg(x, 0);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x);
    text.setAttribute('y', pos.y + CELL/2 + 18);
    text.setAttribute('class', 'axis-label');
    text.textContent = x;
    labels.appendChild(text);
  }
  for (let y = 0; y <= 7; y++) {
    const pos = gridToSvg(0, y);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x - CELL/2 - 12);
    text.setAttribute('y', pos.y + 4);
    text.setAttribute('class', 'axis-label');
    text.textContent = y;
    labels.appendChild(text);
  }
  
  const northPos = gridToSvg(7, 7);
  const northText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  northText.setAttribute('x', northPos.x + 20);
  northText.setAttribute('y', northPos.y - 10);
  northText.setAttribute('fill', '#ff6b9d');
  northText.setAttribute('font-size', '14');
  northText.setAttribute('font-weight', 'bold');
  northText.textContent = '北 ↑';
  labels.appendChild(northText);
}

function showPaths() {
  if (pathsShown) return;
  pathsShown = true;
  
  const pathLayer = document.getElementById('pathLayer');
  const pointsLayer = document.getElementById('pointsLayer');
  const labelsLayer = document.getElementById('labelsLayer');
  
  const start1 = gridToSvg(0, 0);
  const end1 = gridToSvg(4, 4);
  const path1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  path1.setAttribute('x1', start1.x);
  path1.setAttribute('y1', start1.y);
  path1.setAttribute('x2', end1.x);
  path1.setAttribute('y2', end1.y);
  path1.setAttribute('class', 'path-line');
  pathLayer.appendChild(path1);
  
  const s1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  s1.setAttribute('cx', start1.x);
  s1.setAttribute('cy', start1.y);
  s1.setAttribute('r', '8');
  s1.setAttribute('class', 'point-marker');
  pointsLayer.appendChild(s1);
  const e1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  e1.setAttribute('cx', end1.x);
  e1.setAttribute('cy', end1.y);
  e1.setAttribute('r', '8');
  e1.setAttribute('class', 'point-marker end');
  pointsLayer.appendChild(e1);
  
  const l1s = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  l1s.setAttribute('x', start1.x - 15);
  l1s.setAttribute('y', start1.y + 20);
  l1s.setAttribute('class', 'point-label');
  l1s.textContent = '(0,0)';
  labelsLayer.appendChild(l1s);
  const l1e = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  l1e.setAttribute('x', end1.x);
  l1e.setAttribute('y', end1.y - 15);
  l1e.setAttribute('class', 'point-label');
  l1e.setAttribute('fill', '#00ff88');
  l1e.textContent = '(4,4)';
  labelsLayer.appendChild(l1e);
  
  const start2 = gridToSvg(6, 5);
  const end2 = gridToSvg(3, 2);
  const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  path2.setAttribute('x1', start2.x);
  path2.setAttribute('y1', start2.y);
  path2.setAttribute('x2', end2.x);
  path2.setAttribute('y2', end2.y);
  path2.setAttribute('class', 'path-line');
  path2.setAttribute('stroke', '#00bfff');
  pathLayer.appendChild(path2);
  
  const s2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  s2.setAttribute('cx', start2.x);
  s2.setAttribute('cy', start2.y);
  s2.setAttribute('r', '8');
  s2.setAttribute('fill', '#00bfff');
  s2.setAttribute('stroke', '#fff');
  s2.setAttribute('stroke-width', '2');
  pointsLayer.appendChild(s2);
  const e2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  e2.setAttribute('cx', end2.x);
  e2.setAttribute('cy', end2.y);
  e2.setAttribute('r', '8');
  e2.setAttribute('class', 'point-marker end');
  pointsLayer.appendChild(e2);
  
  const l2s = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  l2s.setAttribute('x', start2.x + 15);
  l2s.setAttribute('y', start2.y - 5);
  l2s.setAttribute('class', 'point-label');
  l2s.setAttribute('fill', '#00bfff');
  l2s.textContent = '(6,5)';
  labelsLayer.appendChild(l2s);
  const l2e = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  l2e.setAttribute('x', end2.x);
  l2e.setAttribute('y', end2.y + 25);
  l2e.setAttribute('class', 'point-label');
  l2e.setAttribute('fill', '#00ff88');
  l2e.textContent = '(3,2)';
  labelsLayer.appendChild(l2e);
  
  document.getElementById('pathBtn').textContent = '✅ 已显示路径';
  document.getElementById('pathBtn').disabled = true;
  addScore(5);
}

function verifyQ1() {
  if (q1done) return;
  const x = document.getElementById('q1x').value;
  const y = document.getElementById('q1y').value;
  const fb = document.getElementById('fb1');
  if (x === '4' && y === '4') {
    fb.textContent = '✅ 正确！从(0,0)向东北走4个对角线到达(4,4)';
    fb.className = 'feedback correct';
    q1done = true;
    addScore(10);
    if (!pathsShown) showPaths();
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，北偏东45°是东北方向，x和y都增加';
    fb.className = 'feedback wrong';
  }
}

function verifyQ2() {
  if (q2done) return;
  const x = document.getElementById('q2x').value;
  const y = document.getElementById('q2y').value;
  const fb = document.getElementById('fb2');
  if (x === '3' && y === '2') {
    fb.textContent = '✅ 正确！从(6,5)向西南走3个对角线到达(3,2)';
    fb.className = 'feedback correct';
    q2done = true;
    addScore(10);
    if (!pathsShown) showPaths();
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，南偏西45°是西南方向，x和y都减少';
    fb.className = 'feedback wrong';
  }
}

function checkComplete() {
  if (q1done && q2done) {
    setTimeout(() => {
      document.getElementById('completeOverlay').classList.add('show');
    }, 500);
  }
}

function addScore(points) {
  score += points;
  document.getElementById('score').textContent = score;
}

// 双播放器逻辑
const listenAudio = document.getElementById('listenAudio');
const explainAudio = document.getElementById('explainAudio');
let listenPlaying = false;
let explainPlaying = false;

function initDualPlayers() {
  listenAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('listenTime').textContent = '0:00 / ' + formatTime(listenAudio.duration);
  });
  explainAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('explainTime').textContent = '0:00 / ' + formatTime(explainAudio.duration);
  });
  listenAudio.addEventListener('timeupdate', updateListenProgress);
  explainAudio.addEventListener('timeupdate', updateExplainProgress);
  listenAudio.addEventListener('ended', () => {
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  });
  explainAudio.addEventListener('ended', () => {
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  });
}

function toggleListen() {
  if (listenPlaying) {
    listenAudio.pause();
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  } else {
    if (explainPlaying) toggleExplain();
    listenAudio.play();
    listenPlaying = true;
    document.getElementById('listenBtn').textContent = '⏸';
    document.getElementById('listenBtn').classList.add('playing');
  }
}

function toggleExplain() {
  if (explainPlaying) {
    explainAudio.pause();
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  } else {
    if (listenPlaying) toggleListen();
    explainAudio.play();
    explainPlaying = true;
    document.getElementById('explainBtn').textContent = '⏸';
    document.getElementById('explainBtn').classList.add('playing');
    if (!correctAnswersShown) showCorrectAnswers();
  }
}

function playExplainFromOverlay() {
  document.getElementById('completeOverlay').classList.remove('show');
  listenAudio.pause();
  listenAudio.currentTime = 0;
  listenPlaying = false;
  document.getElementById('listenBtn').textContent = '▶';
  document.getElementById('listenBtn').classList.remove('playing');
  explainAudio.currentTime = 0;
  explainAudio.play();
  explainPlaying = true;
  document.getElementById('explainBtn').textContent = '⏸';
  document.getElementById('explainBtn').classList.add('playing');
  if (!correctAnswersShown) showCorrectAnswers();
}

function showCorrectAnswers() {
  correctAnswersShown = true;
  if (!pathsShown) showPaths();
  document.getElementById('q1x').value = '4';
  document.getElementById('q1y').value = '4';
  document.getElementById('q2x').value = '3';
  document.getElementById('q2y').value = '2';
}

function seekListen(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  listenAudio.currentTime = percent * listenAudio.duration;
}

function seekExplain(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  explainAudio.currentTime = percent * explainAudio.duration;
}

function updateListenProgress() {
  const percent = (listenAudio.currentTime / listenAudio.duration) * 100;
  document.getElementById('listenProgress').style.width = percent + '%';
  document.getElementById('listenTime').textContent = formatTime(listenAudio.currentTime) + ' / ' + formatTime(listenAudio.duration);
}

function updateExplainProgress() {
  const percent = (explainAudio.currentTime / explainAudio.duration) * 100;
  document.getElementById('explainProgress').style.width = percent + '%';
  document.getElementById('explainTime').textContent = formatTime(explainAudio.currentTime) + ' / ' + formatTime(explainAudio.duration);
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

initGrid();
initDualPlayers();
</script>

<!-- ===== v2 竖屏自适应：旋转+缩放+右侧滚动+触摸坐标转换+drag模拟 ===== -->
<script>
(function(){
  var BASE_W = 1920, BASE_H = 1080;
  var scale = 1, isPortrait = false;
  var panelDone = false;

  function $(s, ctx){ return (ctx||document).querySelector(s); }
  function $$(s, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(s)); }

  /* ---- 1. 竖屏检测 + 旋转 + 整体缩放 ---- */
  function applyLayout(){
    var stage = document.getElementById('stage');
    if(!stage) return;
    var w = window.innerWidth, h = window.innerHeight;
    isPortrait = (h > w) && (w <= 900);

    if(isPortrait){
      var availW = h, availH = w;
      scale = Math.min(availW / BASE_W, availH / BASE_H);
      stage.style.width = BASE_W + 'px';
      stage.style.height = BASE_H + 'px';
      stage.style.marginLeft = -(BASE_W/2) + 'px';
      stage.style.marginTop = -(BASE_H/2) + 'px';
      stage.style.transform = 'rotate(90deg) scale(' + scale + ')';
      document.body.classList.add('portrait-mode');
      rearrangePanel();
    } else {
      stage.style.width = '';
      stage.style.height = '';
      stage.style.marginLeft = '';
      stage.style.marginTop = '';
      stage.style.transform = '';
      document.body.classList.remove('portrait-mode');
    }
  }

  /* ---- 2. 右侧边栏重排：播放器固定底部，其余可滚动 ---- */
  function rearrangePanel(){
    if(panelDone) return;
    var panels = $$('.students-panel, .right-panel, .info-panel, .answer-panel, .quiz-panel');
    panels.forEach(function(panel){
      var players = $$('.explain-card, .player-card, .audio-card', panel);
      if(players.length === 0) return;
      var scrollArea = document.createElement('div');
      scrollArea.className = 'panel-scroll-area';
      var playersArea = document.createElement('div');
      playersArea.className = 'panel-players';
      players.forEach(function(p){ playersArea.appendChild(p); });
      while(panel.firstChild){ scrollArea.appendChild(panel.firstChild); }
      panel.appendChild(scrollArea);
      panel.appendChild(playersArea);
    });
    panelDone = true;
  }

  /* ---- 3. 触摸坐标转换（逆旋转+逆缩放） ---- */
  function convertCoords(cx, cy){
    if(!isPortrait) return {x:cx, y:cy};
    var scx = window.innerWidth/2, scy = window.innerHeight/2;
    var dx = (cx - scx) / scale;
    var dy = (cy - scy) / scale;
    // 逆旋转（逆时针90度）
    return { x: scx - dy, y: scy + dx };
  }

  function fireMouse(type, target, x, y){
    var evt = new MouseEvent(type, {bubbles:true, cancelable:true, clientX:x, clientY:y, button:0});
    target.dispatchEvent(evt);
  }

  function isInRightPanel(el){
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('students-panel')||el.classList.contains('right-panel')||
         el.classList.contains('info-panel')||el.classList.contains('answer-panel')||
         el.classList.contains('quiz-panel')||el.classList.contains('panel-scroll-area')||
         el.classList.contains('panel-players'))) return true;
      el = el.parentNode;
    }
    return false;
  }

  /* ---- 4. drag模拟状态 ---- */
  var dragSrc = null, lastDropTarget = null;

  function findDropTarget(x, y){
    var el = document.elementFromPoint(x, y);
    while(el && el !== document.body){
      if(el.classList && (el.classList.contains('seat')||el.classList.contains('drop-zone')||
         el.classList.contains('target')||el.classList.contains('cell')||
         el.getAttribute && el.getAttribute('data-drop') === '1')) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* ---- 5. 全局touch拦截（仅左侧交互区域） ---- */
  document.addEventListener('touchstart', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return; // 右侧边栏原生处理
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(!target) return;
    fireMouse('mousedown', target, coords.x, coords.y);
    // drag模拟
    if(target.getAttribute && target.getAttribute('draggable') === 'true'){
      dragSrc = target;
      var dt = new DataTransfer();
      try{
        var de = new DragEvent('dragstart', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt});
        target.dispatchEvent(de);
      }catch(err){}
    }
    if(target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') target.focus();
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(!isPortrait) return;
    var t = e.touches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y);
    if(target) fireMouse('mousemove', target, coords.x, coords.y);
    // drag模拟：dragover / dragleave
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget !== lastDropTarget){
        if(lastDropTarget){
          try{ lastDropTarget.dispatchEvent(new DragEvent('dragleave', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        if(dropTarget){
          try{ dropTarget.dispatchEvent(new DragEvent('dragover', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
        }
        lastDropTarget = dropTarget;
      }
    }
  }, {passive:false});

  document.addEventListener('touchend', function(e){
    if(!isPortrait) return;
    var t = e.changedTouches[0];
    var visualTarget = document.elementFromPoint(t.clientX, t.clientY);
    if(isInRightPanel(visualTarget)) return;
    e.preventDefault();
    var coords = convertCoords(t.clientX, t.clientY);
    var target = document.elementFromPoint(coords.x, coords.y) || visualTarget;
    if(target){
      fireMouse('mouseup', target, coords.x, coords.y);
      fireMouse('click', target, coords.x, coords.y);
    }
    // drag模拟：drop / dragend
    if(dragSrc){
      var dropTarget = findDropTarget(coords.x, coords.y);
      if(dropTarget){
        try{
          var dt = new DataTransfer();
          dropTarget.dispatchEvent(new DragEvent('drop', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y, dataTransfer:dt}));
        }catch(err){}
      }
      try{ dragSrc.dispatchEvent(new DragEvent('dragend', {bubbles:true, cancelable:true, clientX:coords.x, clientY:coords.y})); }catch(err){}
      dragSrc = null;
      lastDropTarget = null;
    }
  }, {passive:false});

  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', function(){ setTimeout(applyLayout, 150); });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyLayout);
  } else {
    applyLayout();
  }
})();
</script>

</body>
