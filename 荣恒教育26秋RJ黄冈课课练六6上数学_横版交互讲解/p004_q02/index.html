<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航模飞机位置·方向与距离</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a3e 100%);
  min-height: 100vh;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(0,0,0,0.4);
}
.header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ce93d8, #ba68c8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.score-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #ce93d8, #ba68c8);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  color: #1a0a2e;
}
.main-container {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 60px);
}
.left-area {
  flex: 1;
  background: rgba(206,147,216,0.05);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(206,147,216,0.15);
 position: relative; overflow: hidden;}
.map-title {
  font-size: 18px;
  color: #ce93d8;
  margin-bottom: 12px;
  text-align: center;
}
.map-container {
  position: relative;
  
  
  background: rgba(0,0,0,0.2);
  border-radius: 12px;
  border: 1px solid rgba(206,147,216,0.2);
 transform: scale(1.4); transform-origin: center;}
.map-svg {
  width: 100%;
  height: 100%;
}
.dashed-line {
  stroke: #ff6b9d;
  stroke-width: 1;
  stroke-dasharray: 4,4;
  opacity: 0.6;
}
.connection-line {
  stroke: #ff6b9d;
  stroke-width: 2;
}
.plane-marker {
  fill: #ffd700;
  stroke: #fff;
  stroke-width: 2;
}
.plane-label {
  font-size: 14px;
  fill: #ffd700;
  font-weight: bold;
  text-anchor: middle;
}
.plane3-marker {
  fill: #ce93d8;
  stroke: #fff;
  stroke-width: 2;
  opacity: 0;
  transition: opacity 0.5s;
}
.plane3-marker.show {
  opacity: 1;
}
.plane3-label {
  font-size: 14px;
  fill: #ce93d8;
  font-weight: bold;
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.5s;
}
.plane3-label.show {
  opacity: 1;
}
.ray3-line {
  stroke: #ce93d8;
  stroke-width: 2;
  stroke-dasharray: 6,3;
  opacity: 0;
  transition: opacity 0.5s;
}
.ray3-line.show {
  opacity: 1;
}
.angle-arc {
  fill: none;
  stroke: #00bfff;
  stroke-width: 2;
  stroke-dasharray: 4,3;
}
.angle-text {
  font-size: 13px;
  fill: #00bfff;
  font-weight: bold;
}
.north-label {
  font-size: 14px;
  fill: #ff6b9d;
  font-weight: bold;
}
.scale-bar {
  position: absolute;
  bottom: 15px;
  right: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.scale-line {
  width: 40px;
  height: 4px;
  background: linear-gradient(90deg, #ff6b9d, #ff8c00);
  border-radius: 2px;
}
.scale-text {
  font-size: 12px;
  color: #aaa;
}
.btn-mark {
  margin-top: 16px;
  padding: 12px 28px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #ce93d8, #9c27b0);
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}
.btn-mark:hover { transform: scale(1.05); }
.btn-mark:disabled {
  background: #555;
  cursor: not-allowed;
  transform: none;
}
.right-panel {
  width: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.task-card {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px;
  border-left: 4px solid #ce93d8;
}
.task-card h3 {
  font-size: 15px;
  color: #ce93d8;
  margin-bottom: 10px;
}
.task-text {
  font-size: 13px;
  line-height: 1.8;
  color: #ddd;
  margin-bottom: 10px;
}
.task-text input {
  width: 50px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #555;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 13px;
  text-align: center;
  margin: 0 2px;
}
.task-text input:focus {
  outline: none;
  border-color: #ce93d8;
}
.btn-verify {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #ce93d8, #9c27b0);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  margin-top: 8px;
}
.feedback {
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
}
.feedback.correct { color: #ce93d8; }
.feedback.wrong { color: #ff6b6b; }
.hint-box {
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
}
.hint-box p {
  font-size: 12px;
  color: #ffd700;
  line-height: 1.6;
}
.player-card {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px;
}
.player-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.player-title.listen { color: #00bfff; }
.player-title.explain { color: #ff8c00; }
.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #00bfff, #0080ff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00bfff, #0080ff);
  border-radius: 3px;
  width: 0%;
}
.time-display {
  font-size: 12px;
  color: #aaa;
  min-width: 80px;
  text-align: right;
}
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #1a0a2e, #2d1b4e);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  border: 2px solid #ce93d8;
}
.overlay-content h2 { font-size: 28px; color: #ce93d8; margin-bottom: 16px; }
.overlay-content p { font-size: 16px; color: #ddd; margin-bottom: 24px; }
.overlay-btn {
  padding: 12px 32px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff8c00, #ff6b00);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* ===== 竖屏自适应旋转（手机/平板自动横屏显示） ===== */
@media (orientation: portrait) and (max-width: 900px) {
  body {
    overflow: hidden;
    background: #000;
  }
  .stage {
    transform: rotate(90deg);
    transform-origin: center center;
    width: 100vh !important;
    height: 100vw !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    margin-left: -50vh !important;
    margin-top: -50vw !important;
    border-radius: 0 !important;
  }
  /* 旋转提示（可选，显示3秒后淡出） */
  .rotate-hint {
    display: flex !important;
  }
}

/* 旋转提示层 */
.rotate-hint {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 16px;
  animation: fadeOutHint 3s ease-in-out 2s forwards;
}
.rotate-hint .phone-icon {
  font-size: 64px;
  animation: rotatePhone 1.5s ease-in-out infinite;
}
.rotate-hint .hint-text {
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
}
@keyframes rotatePhone {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
@keyframes fadeOutHint {
  to { opacity: 0; visibility: hidden; }
}

</style>
</head>
<body>
<!-- 竖屏旋转提示 -->
<div class="rotate-hint">
  <div class="phone-icon">📱</div>
  <div class="hint-text">已自动旋转为横屏模式<br>建议横屏观看效果更佳</div>
</div>


<div class="header">
  <h1>✈️ 航模飞机位置·方向与距离</h1>
  <div class="score-box">⭐ <span id="score">0</span> 分</div>
</div>

<div class="main-container">
  <div class="left-area">
    <div class="map-title">航模飞机位置图（比例尺：1段 = 10m）</div>
    <div class="map-container">
      <svg class="map-svg" viewBox="0 0 400 380" id="mapSvg">
        <g id="baseLayer"></g>
        <g id="planesLayer"></g>
        <g id="plane3Layer"></g>
      </svg>
      <div class="scale-bar">
        <div class="scale-line"></div>
        <div class="scale-text">10 m</div>
      </div>
    </div>
    <button class="btn-mark" id="markBtn" onclick="markPlane3()">📍 标出③号机位置</button>
  </div>

  <div class="right-panel">
    <div class="task-card">
      <h3>📋 第(1)问</h3>
      <div class="task-text">
        ②号机在①号机的(<input type="text" id="q1a">)偏(<input type="text" id="q1b">)(<input type="text" id="q1c">)°方向上，距离是(<input type="text" id="q1d">)m。
      </div>
      <button class="btn-verify" onclick="verifyQ1()">验证</button>
      <div class="feedback" id="fb1"></div>
      <div class="hint-box">
        <p>💡 提示：从①号机看②号机，数一下有几段，每段10m</p>
      </div>
    </div>

    <div class="task-card">
      <h3>📋 第(2)问·操作题</h3>
      <div class="task-text">
        ③号机在②号机的北偏西20°方向上，距离是20m。根据描述，在图中用"·"标出③号机的位置。
      </div>
      <button class="btn-verify" onclick="verifyQ2()">我已标出</button>
      <div class="feedback" id="fb2"></div>
    </div>

    <div class="player-card">
      <div class="player-title listen">🎧 听题·动手做</div>
      <div class="player-controls">
        <button class="play-btn" id="listenBtn" onclick="toggleListen()">▶</button>
        <div class="progress-bar" onclick="seekListen(event)">
          <div class="progress-fill" id="listenProgress"></div>
        </div>
        <div class="time-display" id="listenTime">0:00 / 0:00</div>
      </div>
    </div>

    <div class="player-card">
      <div class="player-title explain">📖 听讲·老师做</div>
      <div class="player-controls">
        <button class="play-btn" id="explainBtn" onclick="toggleExplain()">▶</button>
        <div class="progress-bar" onclick="seekExplain(event)">
          <div class="progress-fill" id="explainProgress"></div>
        </div>
        <div class="time-display" id="explainTime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-content">
    <h2>🎉 完成啦！</h2>
    <p>你已经完成了所有题目，来听听老师的讲解吧！</p>
    <button class="overlay-btn" onclick="playExplainFromOverlay()">📖 听讲·老师做</button>
  </div>
</div>

<audio id="listenAudio" src="audio/intro.mp3" preload="metadata"></audio>
<audio id="explainAudio" src="audio/explain.mp3" preload="metadata"></audio>

<script>
const PLANE1 = {x: 280, y: 100};
const PLANE2 = {x: 120, y: 240};
let score = 0;
let q1done = false;
let q2done = false;
let plane3Marked = false;
let correctAnswersShown = false;

function initMap() {
  const base = document.getElementById('baseLayer');
  
  const northText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  northText.setAttribute('x', 350);
  northText.setAttribute('y', 60);
  northText.setAttribute('class', 'north-label');
  northText.textContent = '北 ↑';
  base.appendChild(northText);
  
  const dashed1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  dashed1.setAttribute('x1', PLANE1.x - 60);
  dashed1.setAttribute('y1', PLANE1.y);
  dashed1.setAttribute('x2', PLANE1.x + 40);
  dashed1.setAttribute('y2', PLANE1.y);
  dashed1.setAttribute('class', 'dashed-line');
  base.appendChild(dashed1);
  
  const dashed2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  dashed2.setAttribute('x1', PLANE1.x);
  dashed2.setAttribute('y1', PLANE1.y - 40);
  dashed2.setAttribute('x2', PLANE1.x);
  dashed2.setAttribute('y2', PLANE1.y + 60);
  dashed2.setAttribute('class', 'dashed-line');
  base.appendChild(dashed2);
  
  const dashed3 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  dashed3.setAttribute('x1', PLANE2.x - 40);
  dashed3.setAttribute('y1', PLANE2.y);
  dashed3.setAttribute('x2', PLANE2.x + 60);
  dashed3.setAttribute('y2', PLANE2.y);
  dashed3.setAttribute('class', 'dashed-line');
  base.appendChild(dashed3);
  
  const dashed4 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  dashed4.setAttribute('x1', PLANE2.x);
  dashed4.setAttribute('y1', PLANE2.y - 60);
  dashed4.setAttribute('x2', PLANE2.x);
  dashed4.setAttribute('y2', PLANE2.y + 40);
  dashed4.setAttribute('class', 'dashed-line');
  base.appendChild(dashed4);
  
  const conn = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  conn.setAttribute('x1', PLANE1.x);
  conn.setAttribute('y1', PLANE1.y);
  conn.setAttribute('x2', PLANE2.x);
  conn.setAttribute('y2', PLANE2.y);
  conn.setAttribute('class', 'connection-line');
  base.appendChild(conn);
  
  const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const r = 35;
  const startAngle = 180;
  const endAngle = 180 + 35;
  const startRad = startAngle * Math.PI / 180;
  const endRad = endAngle * Math.PI / 180;
  const sx = PLANE1.x + r * Math.cos(startRad);
  const sy = PLANE1.y + r * Math.sin(startRad);
  const ex = PLANE1.x + r * Math.cos(endRad);
  const ey = PLANE1.y + r * Math.sin(endRad);
  arc.setAttribute('d', `M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}`);
  arc.setAttribute('class', 'angle-arc');
  base.appendChild(arc);
  
  const angleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  const textRad = (180 + 17.5) * Math.PI / 180;
  angleText.setAttribute('x', PLANE1.x + 50 * Math.cos(textRad));
  angleText.setAttribute('y', PLANE1.y + 50 * Math.sin(textRad));
  angleText.setAttribute('class', 'angle-text');
  angleText.textContent = '35°';
  base.appendChild(angleText);
  
  const planes = document.getElementById('planesLayer');
  
  const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  p1.setAttribute('cx', PLANE1.x);
  p1.setAttribute('cy', PLANE1.y);
  p1.setAttribute('r', '8');
  p1.setAttribute('class', 'plane-marker');
  planes.appendChild(p1);
  
  const p1Label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  p1Label.setAttribute('x', PLANE1.x + 20);
  p1Label.setAttribute('y', PLANE1.y - 5);
  p1Label.setAttribute('class', 'plane-label');
  p1Label.setAttribute('text-anchor', 'start');
  p1Label.textContent = '①号机';
  planes.appendChild(p1Label);
  
  const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  p2.setAttribute('cx', PLANE2.x);
  p2.setAttribute('cy', PLANE2.y);
  p2.setAttribute('r', '8');
  p2.setAttribute('class', 'plane-marker');
  planes.appendChild(p2);
  
  const p2Label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  p2Label.setAttribute('x', PLANE2.x - 20);
  p2Label.setAttribute('y', PLANE2.y + 25);
  p2Label.setAttribute('class', 'plane-label');
  p2Label.setAttribute('text-anchor', 'end');
  p2Label.textContent = '②号机';
  planes.appendChild(p2Label);
}

function markPlane3() {
  if (plane3Marked) return;
  plane3Marked = true;
  
  const layer = document.getElementById('plane3Layer');
  
  const angle = -90 - 20;
  const rad = angle * Math.PI / 180;
  const dist = 80;
  const p3x = PLANE2.x + dist * Math.cos(rad);
  const p3y = PLANE2.y + dist * Math.sin(rad);
  
  const ray = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ray.setAttribute('x1', PLANE2.x);
  ray.setAttribute('y1', PLANE2.y);
  ray.setAttribute('x2', p3x);
  ray.setAttribute('y2', p3y);
  ray.setAttribute('class', 'ray3-line');
  layer.appendChild(ray);
  setTimeout(() => ray.classList.add('show'), 100);
  
  const p3 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  p3.setAttribute('cx', p3x);
  p3.setAttribute('cy', p3y);
  p3.setAttribute('r', '8');
  p3.setAttribute('class', 'plane3-marker');
  layer.appendChild(p3);
  setTimeout(() => p3.classList.add('show'), 400);
  
  const p3Label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  p3Label.setAttribute('x', p3x);
  p3Label.setAttribute('y', p3y - 15);
  p3Label.setAttribute('class', 'plane3-label');
  p3Label.textContent = '③号机';
  layer.appendChild(p3Label);
  setTimeout(() => p3Label.classList.add('show'), 500);
  
  document.getElementById('markBtn').textContent = '✅ 已标出③号机位置';
  document.getElementById('markBtn').disabled = true;
  addScore(10);
}

function verifyQ1() {
  if (q1done) return;
  const a = document.getElementById('q1a').value;
  const b = document.getElementById('q1b').value;
  const c = document.getElementById('q1c').value;
  const d = document.getElementById('q1d').value;
  const fb = document.getElementById('fb1');
  if ((a === '南' && b === '西' || a === '西' && b === '南') && c === '35' && d === '30') {
    fb.textContent = '✅ 正确！②号机在①号机南偏西35°方向，距离30m';
    fb.className = 'feedback correct';
    q1done = true;
    addScore(10);
    checkComplete();
  } else {
    fb.textContent = '❌ 再想想，从①号机看②号机，方向和距离是多少？';
    fb.className = 'feedback wrong';
  }
}

function verifyQ2() {
  if (q2done) return;
  if (!plane3Marked) {
    markPlane3();
  }
  q2done = true;
  document.getElementById('fb2').textContent = '✅ ③号机位置已标出！';
  document.getElementById('fb2').className = 'feedback correct';
  addScore(10);
  checkComplete();
}

function checkComplete() {
  if (q1done && q2done) {
    setTimeout(() => {
      document.getElementById('completeOverlay').classList.add('show');
    }, 500);
  }
}

function addScore(points) {
  score += points;
  document.getElementById('score').textContent = score;
}

// 双播放器逻辑
const listenAudio = document.getElementById('listenAudio');
const explainAudio = document.getElementById('explainAudio');
let listenPlaying = false;
let explainPlaying = false;

function initDualPlayers() {
  listenAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('listenTime').textContent = '0:00 / ' + formatTime(listenAudio.duration);
  });
  explainAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('explainTime').textContent = '0:00 / ' + formatTime(explainAudio.duration);
  });
  listenAudio.addEventListener('timeupdate', updateListenProgress);
  explainAudio.addEventListener('timeupdate', updateExplainProgress);
  listenAudio.addEventListener('ended', () => {
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  });
  explainAudio.addEventListener('ended', () => {
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  });
}

function toggleListen() {
  if (listenPlaying) {
    listenAudio.pause();
    listenPlaying = false;
    document.getElementById('listenBtn').textContent = '▶';
    document.getElementById('listenBtn').classList.remove('playing');
  } else {
    if (explainPlaying) toggleExplain();
    listenAudio.play();
    listenPlaying = true;
    document.getElementById('listenBtn').textContent = '⏸';
    document.getElementById('listenBtn').classList.add('playing');
  }
}

function toggleExplain() {
  if (explainPlaying) {
    explainAudio.pause();
    explainPlaying = false;
    document.getElementById('explainBtn').textContent = '▶';
    document.getElementById('explainBtn').classList.remove('playing');
  } else {
    if (listenPlaying) toggleListen();
    explainAudio.play();
    explainPlaying = true;
    document.getElementById('explainBtn').textContent = '⏸';
    document.getElementById('explainBtn').classList.add('playing');
    if (!correctAnswersShown) showCorrectAnswers();
  }
}

function playExplainFromOverlay() {
  document.getElementById('completeOverlay').classList.remove('show');
  listenAudio.pause();
  listenAudio.currentTime = 0;
  listenPlaying = false;
  document.getElementById('listenBtn').textContent = '▶';
  document.getElementById('listenBtn').classList.remove('playing');
  explainAudio.currentTime = 0;
  explainAudio.play();
  explainPlaying = true;
  document.getElementById('explainBtn').textContent = '⏸';
  document.getElementById('explainBtn').classList.add('playing');
  if (!correctAnswersShown) showCorrectAnswers();
}

function showCorrectAnswers() {
  correctAnswersShown = true;
  if (!plane3Marked) markPlane3();
  document.getElementById('q1a').value = '南';
  document.getElementById('q1b').value = '西';
  document.getElementById('q1c').value = '35';
  document.getElementById('q1d').value = '30';
}

function seekListen(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  listenAudio.currentTime = percent * listenAudio.duration;
}

function seekExplain(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  explainAudio.currentTime = percent * explainAudio.duration;
}

function updateListenProgress() {
  const percent = (listenAudio.currentTime / listenAudio.duration) * 100;
  document.getElementById('listenProgress').style.width = percent + '%';
  document.getElementById('listenTime').textContent = formatTime(listenAudio.currentTime) + ' / ' + formatTime(listenAudio.duration);
}

function updateExplainProgress() {
  const percent = (explainAudio.currentTime / explainAudio.duration) * 100;
  document.getElementById('explainProgress').style.width = percent + '%';
  document.getElementById('explainTime').textContent = formatTime(explainAudio.currentTime) + ' / ' + formatTime(explainAudio.duration);
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

initMap();
initDualPlayers();
</script>
