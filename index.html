<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动课程题库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1em;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        .book-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
        }
        .book-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .book-card.history .book-icon { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .book-card.math .book-icon { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .book-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        .book-subtitle {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 15px;
        }
        .book-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .meta-tag {
            background: #f0f2f5;
            color: #666;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        .enter-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 0.95em;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .book-card:hover .enter-btn { opacity: 0.9; }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
        }
    </style>
</head>

    <div class="container">

        <div class="book-grid">

                <div class="book-meta">

                </div>

            </a>

                <div class="book-meta">

                    <span class="meta-tag">题目：22道</span>
                </div>
                <button class="enter-btn">进入题库 →</button>
            </a>
            <a href="黄冈课课练_六上数学_p001_q01/p001_q01.html" class="book-card math">

                <div class="book-meta">

                    <span class="meta-tag">年级：六年级上册</span>
                    <span class="meta-tag">题型：填空题</span>
                </div>
                <button class="enter-btn">开始学习 →</button>
            </a>
            <a href="黄冈课课练_六上数学_p001_q04/p001_q04.html" class="book-card math">

        </div>
        <div class="footer">
            <p>© 2026 互动课程题库 · 由AI智能生成</p>
        </div>
    </div>
</body>
</html>
